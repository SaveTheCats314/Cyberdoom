<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#040507">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>NIGHT CITY // FLATLINE</title>
  <link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-title" content="Cyberdoom">
<meta name="application-name" content="Cyberdoom">
<style>
  :root{
    --bg:#040507;
    --panel:#0a0d12;
    --panel2:#0f141b;
    --line:#1c2632;
    --text:#c3d0da;
    --dim:#54687a;
    --magenta:#ff2e88;
    --cyan:#2fe6e0;
    --amber:#ffb020;
    --red:#ff4757;
    --green:#3dff9a;
    --purple:#b26bff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; background:var(--bg);}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Courier New', ui-monospace, 'SF Mono', Menlo, monospace;
    font-size:15px; line-height:1.45;
    overscroll-behavior:none;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
#app{
  width:100%;
  max-width:640px;
  height:100dvh;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
  #hdr{
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  flex:0 0 auto;
  background:rgba(4,5,7,0.97);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  z-index:5;
}
  }
  #hdr .title{color:var(--cyan); font-weight:bold; letter-spacing:1px; font-size:14px;}
  #hdr .title span{color:var(--magenta);}
  #hdr .sub{color:var(--purple); font-size:11px;}
#hdr.run-hidden{
  display:none;
}
  #status{
  display:none;
  flex:0 0 auto;
  padding:8px 12px 10px;
  border-bottom:1px solid var(--line);
  background:rgba(7,10,14,0.98);
  font-size:12px;
}

#status.on{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.hudTop{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
}

.hudClass{
  color:var(--cyan);
  font-weight:bold;
  letter-spacing:1px;
  font-size:12px;
}

.hudDistrict{
  color:var(--dim);
  text-align:center;
  font-size:11px;
  letter-spacing:.5px;
}

.hudMoney{
  color:var(--amber);
  text-align:right;
}

.hudMoney b{
  color:var(--amber);
}

.hudMeters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.hudMeter{
  min-width:0;
}

.hudMeterHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
  color:var(--dim);
  font-size:10px;
  letter-spacing:1px;
}

.hudMeterHead b{
  color:var(--text);
  font-size:11px;
}

.hudBar{
  width:100%;
  height:7px;
  background:#141b23;
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
}

.hudBar > i{
  display:block;
  height:100%;
  width:100%;
  transition:width .18s ease-out, background .18s ease-out;
}

#barHp{
  background:var(--green);
}

#barHum{
  background:var(--cyan);
}

  #enemyStatus{
  display:none;
  flex:0 0 auto;
  padding:9px 12px 10px;
  border-bottom:1px solid rgba(255,71,87,0.35);
  background:
    linear-gradient(
      90deg,
      rgba(255,71,87,0.07),
      rgba(255,46,136,0.025)
    ),
    #07090d;
}

#enemyStatus.on{
  display:block;
}

.enemyTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:6px;
}

#enemyName{
  color:var(--red);
  font-size:12px;
  font-weight:bold;
  letter-spacing:.7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.enemyBadges{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  flex:0 0 auto;
}

#enemyThreat{
  flex:0 0 auto;
  border:1px solid var(--line);
  border-radius:3px;
  padding:1px 5px;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
}

#enemyThreat.street{
  color:var(--green);
  border-color:rgba(61,255,154,0.45);
}

#enemyThreat.dangerous{
  color:var(--amber);
  border-color:rgba(255,176,32,0.55);
}

#enemyThreat.lethal{
  color:var(--red);
  border-color:rgba(255,71,87,0.7);
  box-shadow:0 0 8px rgba(255,71,87,0.12);
}

#enemyType{
  flex:0 0 auto;
  color:var(--dim);
  border:1px solid var(--line);
  border-radius:3px;
  padding:1px 5px;
  font-size:9px;
  letter-spacing:1px;
}

#enemyType.elite{
  color:var(--amber);
  border-color:rgba(255,176,32,0.5);
}

#enemyType.boss{
  color:var(--magenta);
  border-color:rgba(255,46,136,0.6);
  font-weight:bold;
}

.enemyHpHead{
  display:flex;
  justify-content:space-between;
  color:var(--dim);
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:3px;
}

.enemyHpHead b{
  color:var(--text);
}

.enemyBar{
  width:100%;
  height:8px;
  overflow:hidden;
  border:1px solid rgba(255,71,87,0.35);
  border-radius:4px;
  background:#14161c;
}

.enemyBar > i{
  display:block;
  width:100%;
  height:100%;
  background:var(--red);
  transition:width .18s ease-out, background .18s ease-out;
}

.enemyDetails{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  margin-top:6px;
  color:var(--dim);
  font-size:9px;
  letter-spacing:.6px;
}

.enemyDetails > span:last-child{
  text-align:right;
}

.enemyDetails b{
  color:var(--text);
}

#enemyEffects{
  text-align:center;
  color:var(--amber);
  white-space:nowrap;
}
  
#log{
  flex:1 1 auto;
  min-height:0;
  padding:14px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
  .entry{margin-bottom:14px; animation:fadein .18s ease-out;}
  @keyframes fadein{from{opacity:0; transform:translateY(2px);} to{opacity:1; transform:none;}}
  .entry p{margin:0 0 6px 0;}
  .sys{color:var(--dim);}
  .tag{display:inline-block; font-size:10px; letter-spacing:1px; padding:1px 6px; border:1px solid var(--line); border-radius:3px; margin-right:6px; color:var(--dim);}
  .tag.combat{border-color:var(--red); color:var(--red);}
  .tag.hack{border-color:var(--cyan); color:var(--cyan);}
  .tag.loot{border-color:var(--amber); color:var(--amber);}
  .tag.crit{border-color:var(--magenta); color:var(--magenta);}
  .tag.boss{border-color:var(--magenta); color:var(--magenta); font-weight:bold;}
  .tag.relic{border-color:var(--purple); color:var(--purple);}
  .flavor{color:var(--dim); font-style:italic;}
  .accent{color:var(--cyan);}
  .warn{color:var(--amber);}
  .bad{color:var(--red);}
  .good{color:var(--green);}
  .purp{color:var(--purple);}
  .divider{border:none; border-top:1px dashed var(--line); margin:14px 0;}

  #actions{
    flex:0 0 auto; border-top:1px solid var(--line); padding:10px; display:grid; gap:8px;
    grid-template-columns:1fr 1fr; background:var(--panel);
  }
  #actions.single{grid-template-columns:1fr;}
  button.act{
    font-family:inherit; font-size:13.5px; text-align:left; color:var(--text);
    background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    padding:11px 12px; cursor:pointer;
  }
  button.act:active{background:#161f29; border-color:var(--cyan); transform:scale(0.99);}
  button.act .k{color:var(--cyan); margin-right:6px;}
  button.act.danger .k{color:var(--red);}
  button.act.gold .k{color:var(--amber);}
  button.act.purp .k{color:var(--purple);}
  button.act:disabled{opacity:0.32;}
  button.act small{display:block; color:var(--dim); font-size:11px; margin-top:2px;}

  .hudSheetBtn{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background:transparent;
    padding:0;
    margin:0;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
  }
  .hudSheetBtn::after{
    content:'  ▾';
    color:var(--dim);
    font-size:9px;
  }

  .sheetOverlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(2,4,7,0.94);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheetOverlay.on{display:flex;}
  .sheetPanel{
    width:100%;
    max-width:640px;
    height:100%;
    margin:0 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--bg);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    padding:14px;
  }
  .sheetHead{
    position:sticky;
    top:0;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 0 12px;
    margin-bottom:10px;
    background:rgba(4,5,7,0.97);
    border-bottom:1px solid var(--line);
  }
  .sheetHead h2{
    margin:2px 0 0;
    color:var(--cyan);
    font-size:18px;
    letter-spacing:1px;
  }
  .sheetEyebrow{
    color:var(--dim);
    font-size:9px;
    letter-spacing:1.5px;
  }
  #sheetClose{
    width:40px;
    height:40px;
    flex:0 0 auto;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel2);
    color:var(--text);
    font-family:inherit;
    font-size:24px;
    line-height:1;
  }
  .sheetSection{
    margin:0 0 12px;
    padding:11px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--panel);
  }
  .sheetSection h3{
    margin:0 0 8px;
    color:var(--magenta);
    font-size:11px;
    letter-spacing:1.2px;
  }
  .sheetStatGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
  }
  .sheetStat{
    padding:7px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--panel2);
    min-width:0;
  }
  .sheetStat span{
    display:block;
    color:var(--dim);
    font-size:8px;
    letter-spacing:.8px;
  }
  .sheetStat b{
    display:block;
    margin-top:2px;
    color:var(--text);
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sheetItem{
    padding:8px 0;
    border-top:1px dashed var(--line);
  }
  .sheetItem:first-of-type{border-top:0; padding-top:0;}
  .sheetItem:last-child{padding-bottom:0;}
  .sheetItem b{color:var(--text);}
  .sheetItem small{
    display:block;
    margin-top:2px;
    color:var(--dim);
    font-size:10px;
  }
  .sheetAffinity{
    padding:9px;
    border:1px solid rgba(47,230,224,0.35);
    border-radius:6px;
    background:rgba(47,230,224,0.05);
  }
  .sheetAffinity.inactive{
    border-color:var(--line);
    background:var(--panel2);
    opacity:.72;
  }
  .sheetEmpty{color:var(--dim); font-style:italic;}
  .sheetEquipped{color:var(--green); font-size:9px; letter-spacing:1px;}
  .sheetWeaponRow{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .sheetWeaponInfo{min-width:0; flex:1 1 auto;}
  .sheetDrop{
    flex:0 0 auto;
    border:1px solid rgba(255,71,87,0.45);
    border-radius:5px;
    background:rgba(255,71,87,0.06);
    color:var(--red);
    font-family:inherit;
    font-size:9px;
    letter-spacing:.8px;
    padding:6px 8px;
    cursor:pointer;
  }
  .sheetDrop:disabled{
    opacity:.28;
    cursor:default;
  }

  .cardgrid{display:grid; gap:10px;}
  .card{border:1px solid var(--line); background:var(--panel2); border-radius:8px; padding:12px; cursor:pointer;}
  .card:active{border-color:var(--cyan);}
  .card h3{margin:0 0 4px 0; color:var(--magenta); font-size:14.5px;}
  .card .stats{color:var(--dim); font-size:11.5px; margin-top:6px;}
  .card .stats b{color:var(--cyan);}
  .card.locked{opacity:0.45; cursor:default;}

  #titleScreen{padding:20px 16px; text-align:center;}
  #titleScreen h1{color:var(--magenta); font-size:26px; letter-spacing:2px; margin:26px 0 4px;}
  #titleScreen h1 span{color:var(--cyan);}
  #titleScreen p.tagline{color:var(--dim); margin-bottom:26px; font-size:12px; letter-spacing:1px;}
  #titleScreen .meta{color:var(--dim); font-size:11.5px; margin-top:22px;}

  .mbar{height:8px; background:#141b23; border-radius:4px; overflow:hidden; margin:4px 0 8px;}
  .mbar > i{display:block; height:100%; background:var(--purple);}

  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--line);}
</style>
</head>
<body>
  <div id="runtime-error" style="
    display:none;
  position:fixed;
  z-index:999999;
  top:0;
  left:0;
  right:0;
  max-height:100vh;
  overflow:auto;
  background:#08000a;
  color:#ff4d6d;
  padding:20px;
  font-family:monospace;
  font-size:14px;
  white-space:pre-wrap;
  box-sizing:border-box;
"></div>

<script>
window.onerror = function(message, source, lineno, colno, error) {
  const box = document.getElementById('runtime-error');
  if (box) {
   
    box.style.display = 'block';
    
    box.innerHTML =
      '<strong>CYBERDOOM RUNTIME ERROR</strong>\\n\\n' +
      message + '\\n\\n' +
      'Line: ' + lineno + '\\n' +
      'Column: ' + colno + '\\n\\n' +
      (error && error.stack ? error.stack : '');
  }
};
</script>
<div id="app">
  <div id="hdr">
    <div class="title">NIGHT CITY <span>// FLATLINE</span></div>
    <div class="sub" id="hdrSub">◈ 0 cr</div>
  </div>
 <div id="status">

  <div class="hudTop">
    <button class="hudClass hudSheetBtn" id="stClass" type="button" onclick="openCharacterSheet()" aria-label="Open character sheet">-</button>

    <span class="hudDistrict" id="stFloor">-</span>

    <span class="hudMoney">
      €$ <b id="stEd">-</b>
    </span>
  </div>

   <div id="enemyStatus">

  <div class="enemyTop">
    <span id="enemyName">HOSTILE</span>
    <div class="enemyBadges">
      <span id="enemyThreat">STREET</span>
      <span id="enemyType">CONTACT</span>
    </div>
  </div>

  <div class="enemyHpHead">
    <span>HP</span>
    <b id="enemyHp">-</b>
  </div>

  <div class="enemyBar">
    <i id="enemyHpBar"></i>
  </div>

  <div class="enemyDetails">
    <span>ARMOR <b id="enemyArmor">-</b></span>
    <span id="enemyEffects"></span>
    <span>DMG <b id="enemyDamage">-</b></span>
  </div>

</div>
 
   <div class="hudMeters">

    <div class="hudMeter">
      <div class="hudMeterHead">
        <span>HP</span>
        <b id="stHp">-</b>
      </div>

      <div class="hudBar">
        <i id="barHp"></i>
      </div>
    </div>

    <div class="hudMeter">
      <div class="hudMeterHead">
        <span>HUMANITY</span>
        <b id="stHum">-</b>
      </div>

      <div class="hudBar">
        <i id="barHum"></i>
      </div>
    </div>

  </div>

</div>

  <div id="charSheet" class="sheetOverlay" aria-hidden="true">
    <div class="sheetPanel">
      <div class="sheetHead">
        <div>
          <div class="sheetEyebrow">RUN // CHARACTER DATA</div>
          <h2 id="sheetTitle">CHARACTER SHEET</h2>
        </div>
        <button id="sheetClose" type="button" onclick="closeCharacterSheet()" aria-label="Close character sheet">×</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="log"></div>
  <div id="actions"></div>
</div>

<script>
/* =====================================================================
   NIGHT CITY // FLATLINE v2 — cyberpunk text roguelike
   Relics, weapon mutations, fixer boons, class mastery, dual currency
   (Eddies = in-run, Credits = persistent), multiple save slots.
===================================================================== */

const $ = sel => document.querySelector(sel);
const log = $('#log');
const actionsEl = $('#actions');
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[rnd(0, arr.length-1)];
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));

function print(html, cls){
  const d = document.createElement('div');
  d.className = 'entry' + (cls ? ' '+cls : '');
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight + 999;
  return d;
}
function divider(){ print('<hr class="divider">'); }
function actions(list, opts={}){
  actionsEl.innerHTML = '';
  actionsEl.className = (list.length<=1 || opts.single) ? 'single' : '';
  list.forEach((a,i)=>{
    const b = document.createElement('button');
    b.className = 'act' + (a.cls ? ' '+a.cls : '');
    b.innerHTML = `<span class="k">${a.key || (i+1)}›</span>${a.label}${a.sub?`<small>${a.sub}</small>`:''}`;
    if(a.disabled) b.disabled = true;
    b.onclick = ()=>{ if(a.disabled) return; a.fn(); };
    actionsEl.appendChild(b);
  });
}
function setStatus(on){
  $('#status').classList.toggle('on', on);

  // Hide the NIGHT CITY banner during an active run
  $('#hdr').classList.toggle('run-hidden', on);

  // Make sure combat HUD disappears when leaving a run
  if(!on){
    const enemyHud = $('#enemyStatus');
    if(enemyHud) enemyHud.classList.remove('on');
    const sheet = $('#charSheet');
    if(sheet) sheet.classList.remove('on');
  }
}function updateHeader(){ $('#hdrSub').textContent = `◈ ${META ? META.credits : 0} cr`; }
function refreshStatus(){
  if(!S.run) return;

  const p = S.run.player;

  $('#stClass').textContent = p.className.toUpperCase();

  $('#stHp').textContent =
    `${Math.max(0,p.hp)}/${p.maxHp}`;

  const hpPct =
    clamp(p.hp / p.maxHp * 100, 0, 100);

  $('#barHp').style.width = hpPct + '%';

  $('#barHp').style.background =
    hpPct <= 25
      ? 'var(--red)'
      : hpPct <= 50
        ? 'var(--amber)'
        : 'var(--green)';

  $('#stHum').textContent =
    `${Math.max(0,p.humanity)}/${p.maxHumanity}`;

  const humPct =
    clamp(p.humanity / p.maxHumanity * 100, 0, 100);

  $('#barHum').style.width = humPct + '%';

  $('#barHum').style.background =
    humPct <= 25
      ? 'var(--red)'
      : humPct <= 60
        ? 'var(--amber)'
        : 'var(--cyan)';

  $('#stEd').textContent = p.eddies;

  $('#stFloor').textContent = S.run.starting
    ? `${S.run.actName.toUpperCase()} // LOADOUT`
    : `${S.run.actName.toUpperCase()} ${S.run.node+1}/${S.run.actLen}`;
  
  refreshEnemyStatus();
}
   
function closeCharacterSheet(){
  const sheet = $('#charSheet');
  if(!sheet) return;
  sheet.classList.remove('on');
  sheet.setAttribute('aria-hidden','true');
}

function openCharacterSheet(){
  if(!S.run || S.run.over) return;
  renderCharacterSheet();
  const sheet = $('#charSheet');
  sheet.classList.add('on');
  sheet.setAttribute('aria-hidden','false');
}

function dropWeapon(index){
  if(!S.run || S.run.over) return;

  const P = S.run.player;
  if(!Array.isArray(P.inventory) || P.inventory.length<=1) return;

  const weapon = P.inventory[index];
  if(!weapon) return;

  const wasEquipped = weapon === P.weapon;
  P.inventory.splice(index, 1);

  if(wasEquipped){
    P.weapon = P.inventory[0];
  }

  print(
    `<span class="tag">DROP</span> Left <b>${weapon.name}</b> behind.` +
    (wasEquipped ? ` <span class="accent">Equipped ${P.weapon.name}.</span>` : '')
  );

  refreshStatus();
  renderCharacterSheet();
}

function renderCharacterSheet(){
  if(!S.run) return;

  const run = S.run;
  const P = run.player;
  const affinityDef = getAffinityDefinition(P);
  const affinity = getClassWeaponAffinity(P);

function getThreatLevel(P, e, c){
  if(e.boss || c.boss){
    return { label:'LETHAL', cls:'lethal' };
  }

  const avgDamage = (e.dmg[0] + e.dmg[1]) / 2;
  const expectedHit = Math.max(0, avgDamage - Math.floor(P.def));
  const hitPressure = expectedHit / Math.max(1, P.maxHp);
  const hpPressure = e.maxHp / Math.max(1, P.maxHp);

  let score =
    (hitPressure * 2.5) +
    (hpPressure * 0.35) +
    (e.def * 0.05);

  if(e.elite) score += 0.5;
  if(e.berserk) score += 0.2;

  if(score >= 1.15){
    return { label:'LETHAL', cls:'lethal' };
  }

  if(score >= 0.5){
    return { label:'DANGEROUS', cls:'dangerous' };
  }

  return { label:'STREET', cls:'street' };
}

function refreshEnemyStatus(){

  const hud = $('#enemyStatus');

  if(
    !S.run ||
    !S.run.combat ||
    !S.run.combat.enemy ||
    S.run.combat.enemy.hp <= 0 ||
    S.run.over
  ){
    hud.classList.remove('on');
    return;
  }

  const c = S.run.combat;
  const e = c.enemy;

  hud.classList.add('on');

  $('#enemyName').textContent = e.name.toUpperCase();

  const threat = getThreatLevel(S.run.player, e, c);
  const threatEl = $('#enemyThreat');
  threatEl.textContent = threat.label;
  threatEl.className = threat.cls;

  const type = $('#enemyType');

  type.className = '';

  if(e.boss || c.boss){
    type.textContent = 'BOSS';
    type.classList.add('boss');
  }
  else if(e.elite){
    type.textContent = 'ELITE';
    type.classList.add('elite');
  }
  else{
    type.textContent = 'CONTACT';
  }

  $('#enemyHp').textContent =
    `${Math.max(0,e.hp)}/${e.maxHp}`;

  const hpPct =
    clamp(e.hp / e.maxHp * 100, 0, 100);

  $('#enemyHpBar').style.width =
    hpPct + '%';

  $('#enemyHpBar').style.background =
    hpPct <= 25
      ? 'var(--magenta)'
      : hpPct <= 50
        ? 'var(--amber)'
        : 'var(--red)';

  $('#enemyArmor').textContent =
    e.def;

  $('#enemyDamage').textContent =
    `${e.dmg[0]}–${e.dmg[1]}`;

  const effects = [];

  if(e.tech)
    effects.push('TECH');

  if(c.enemyBleed > 0)
    effects.push(`BLEED ${c.enemyBleed}`);

  if(c.enemyStunned)
    effects.push('STUNNED');

  if(e.berserk && e.hp < e.maxHp * 0.4)
    effects.push('BERSERK');

  if(e.phase)
    effects.push(`PHASE ${e.phase}`);

  $('#enemyEffects').textContent =
    effects.join(' • ');
}

function defaultMeta(){
  return {
    runsStarted:0, runsWon:0, bestDistrict:0, credits:0,
    progressionV3:true,
    mastery:{}, // classId -> {kills:0, wins:0}
    unlocks:{ relics:[...BASE_RELIC_UNLOCKS],
              mutations:['bleed','vampiric'],
              cyberware:[...BASE_CHROME_UNLOCKS] },
    purchased:[], // meta-shop perk ids
    log:[]
  };
}
async function peekSlot(n){
  try{
    const r = localStorage.getItem(slotKey(n));
    if(r) return JSON.parse(r);
  }catch(e){}
  return null;
}
async function loadSlot(n){
  const existing = await peekSlot(n);
  META = existing || defaultMeta();

  META.unlocks = META.unlocks || {};
  META.unlocks.relics = [...new Set([...(META.unlocks.relics||[]), ...BASE_RELIC_UNLOCKS])];
  META.unlocks.cyberware = [...new Set([...(META.unlocks.cyberware||[]), ...BASE_CHROME_UNLOCKS])];
  META.unlocks.mutations = META.unlocks.mutations || ['bleed','vampiric'];

  // Existing saves used district index 3 for Corpo Plaza and 4 for Arasaka Tower.
  if(!META.progressionV3){
    if((META.bestDistrict||0) >= 3) META.bestDistrict += 1;
    META.progressionV3 = true;
  }

  SLOT = n;
  updateHeader();
}
async function saveMeta(){
  if(SLOT==null) return;
  try{
    localStorage.setItem(slotKey(SLOT), JSON.stringify(META));
  }catch(e){
    console.warn('save failed', e);
  }
  updateHeader();
}

function rollWeapon(baseId, forceTier){
  const base = WEAPON_BASE[baseId];
  const pre = forceTier!=null ? PREFIX[forceTier] : pick(PREFIX);
  const suf = pick(SUFFIX);
  const dmg = [Math.round(base.dmg[0]*pre.mult), Math.round(base.dmg[1]*pre.mult)];
  const tier = PREFIX.indexOf(pre);
  let mutation = null;
  const pool = mutationPool();
  const mutChance = 0.10 + tier*0.06; // higher tier = more likely to roll a mutation
  if(pool.length && Math.random() < mutChance) mutation = pick(pool);
  return {
    baseId, name: `${pre.n} ${base.name}${suf.n?' '+suf.n:''}${mutation?` ⟨${mutation.name}⟩`:''}`,
    dmg, crit: +(base.crit + suf.crit).toFixed(2),
    hits: base.hits||1, tag: base.tag, tech: !!base.tech,
    humMod: pre.hum, tier, mutation
  };
}

function newPlayer(cls){
  const w = rollWeapon(cls.weapon, 2);
  const m = META.mastery[cls.id] || {kills:0, wins:0};
  const p = {
    cls: cls.id, className: cls.name,
    hp: cls.hp, maxHp: cls.hp,
    def: cls.def, tech: cls.tech, cool: cls.cool,
    humanity: cls.humanity, maxHumanity: cls.humanity,
    eddies: 20 + (META.purchased.includes('perk_eddies') ? 25 : 0),
    dmgRange: cls.dmg, ability: {...cls.ability, ready:true, cdLeft:0},
    weapon: w, inventory:[w],
    cyberware: [], relics:[],
    critBonus:0, dmgBonus:0, dodge:0, cdrBonus:0, regen:0, shopDiscount:0,
    items: { stims: META.purchased.includes('perk_stim') ? 2 : 1 },
    usedSecondWind:false,
  };
  if(p.cls==='fixer') p._extraReroll = (p._extraReroll||0) + 1;
  // meta-shop permanent perks
  ['perk_maxhp_1','perk_maxhp_2','perk_maxhp_3'].forEach(id=>{ if(META.purchased.includes(id)){ p.maxHp+=3; p.hp+=3; } });
  // class mastery bonuses
  if(m.kills >= MASTERY_TIERS[0]){ p.maxHp += 4; p.hp += 4; }
  if(m.kills >= MASTERY_TIERS[1]){ const pas = MASTERY_PASSIVE[cls.id]; if(pas) pas.apply(p); }
  if(m.wins  >= MASTERY_WINS_T3){ p.dmgBonus += 1; p.mastered = true; }
  return p;
}
function addToInventory(P, w){ P.inventory.push(w); if(P.inventory.length>6) P.inventory.shift(); }

function installCyberware(P, cw, risky){
  P.cyberware.push(cw);
  cw.apply(P);
  const humLoss = risky ? cw.hum + rnd(2,6) : cw.hum;
  P.humanity = clamp(P.humanity - humLoss, 0, P.maxHumanity);
  print(`<span class="tag loot">CHROME</span> Installed <b>${cw.name}</b> (${cw.slot}) — ${cw.desc}. <span class="warn">-${humLoss} Humanity</span>.`);
  checkCyberpsychosis(P);
}
function checkCyberpsychosis(P){
  if(P.humanity <= P.maxHumanity*0.25 && !P.cyberpsychosisWarned){
    P.cyberpsychosisWarned = true;
    print(`<span class="tag boss">WARNING</span> <span class="bad">Humanity critical. The line between you and your chrome is getting thin. Combat rolls now have a chance to go berserk.</span>`);
  }
}
function grantRelic(P, relic){
  P.relics.push(relic);
  if(relic.apply) relic.apply(P);
  print(`<span class="tag relic">RELIC</span> Acquired <b class="purp">${relic.name}</b> — ${relic.desc}`);
}

async function startRun(cls, hardMode){
  META.runsStarted++; saveMeta();
  const player = newPlayer(cls);
  S.run = { player, act:0, node:0, actName:ACTS[0].name, actLen:ACTS[0].len, heat:0,
            kills:0, eliteKills:0, actBuffs:[], actEddiesMult:1, actContactDone:false,
            starting:true, hardMode: !!hardMode };
  setStatus(true); refreshStatus();
  log.innerHTML='';
  print(`<span class="tag">JACK IN</span> Character created: <b class="accent">${player.className}</b>${player.mastered?' <span class="purp">[MASTERED]</span>':''}. Starting loadout: <b>${player.weapon.name}</b>.${hardMode?' <span class="bad">OVERWATCH MODE — enemies hit harder, rewards are bigger.</span>':''}`, 'sys');

function runStartChoice(){
  const P = S.run.player;
  S.run.starting = true;
  refreshStatus();

  print(`<span class="tag relic">LOADOUT CACHE</span> Before you disappear into Watson, one last dead-drop waits under a flickering holo-ad. Take one edge into the run.`, 'sys');

  const choices = [...relicPool()]
    .filter(r=>!hasRelic(P,r.id))
    .sort(()=>Math.random()-0.5)
    .slice(0,3);

  const opts = choices.map(r=>({
    label:`Take ${r.name}`,
    sub:r.desc,
    cls:'purp',
    fn:()=>{
      grantRelic(P,r);
      S.run.starting=false;
      refreshStatus();
      divider();
      nextNode();
    }
  }));

  opts.push({
    label:'Take the eddies',
    sub:'+60 eddies instead of a relic',
    cls:'gold',
    fn:()=>{
      P.eddies += 60;
      print(`<span class="tag loot">STARTING CAPITAL</span> <span class="good">+60 eddies.</span>`);
      S.run.starting=false;
      refreshStatus();
      divider();
      nextNode();
    }
  });

  actions(opts);
}

function nextNode(){
  const run = S.run;
  let act = ACTS[run.act];
  refreshStatus();

  if(run.node >= act.len){
    revertActBuffs();
    run.act++;
    if(run.act >= ACTS.length){ return victory(); }
    run.node = 0;
    run.actContactDone = false;
    run.actEddiesMult = 1;
    act = ACTS[run.act];
    run.actName = act.name;
    run.actLen = act.len;
    print(`<span class="tag">DISTRICT</span> Entering <b class="accent">${run.actName}</b>...`, 'sys');
    divider();
    refreshStatus();
  }

  if(act.midboss) return midBossEncounter();
  if(act.boss) return bossEncounter();

  const contactNode = Math.max(2, Math.floor(act.len*0.35));
  if(!run.actContactDone && run.node===contactNode && act.len>3){
    run.actContactDone = true;
    return runContact();
  }

  let type;
  if(run.node === act.len-1){
    type='elite';
  }
  else{
    const roll = Math.random();
    if(roll<0.38) type='combat';
    else if(roll<0.58) type='event';
    else if(roll<0.72) type='shop';
    else if(roll<0.84) type='rest';
    else type='relic';
  }

  if(type==='combat') return startCombat(pick(ENEMY_POOL.street), false);
  if(type==='elite') return startCombat(pick(ENEMY_POOL.elite), true);
  if(type==='event') return runEvent();
  if(type==='shop') return runShop();
  if(type==='rest') return runRest();
  if(type==='relic') return runRelicCache();
}
function advance(){ S.run.node++; refreshStatus(); nextNode(); }

function revertActBuffs(){
  const P = S.run.player;
  S.run.actBuffs.forEach(b=>{
    if(b.stat==='eddiesMult'){ S.run.actEddiesMult = 1; }
    else P[b.stat] -= b.amount;
  });
  S.run.actBuffs = [];
}

function scaledEnemy(base, act, elite, hardMode){
  // Blackwall Relay sits at act index 2, but it should not inflate Corpo's normal scaling tier.
  const tier = act >= 3 ? act-1 : act;
  let hpScale = 1 + tier*0.35;
  let dmgScale = 1 + tier*0.35;

  // Watson is the learning district: reduce burst damage and soften its forced elite.
  if(act===0){
    dmgScale *= 0.85;
    if(elite || base.elite) hpScale *= 0.90;
  }

  if(hardMode){
    hpScale *= 1.2;
    dmgScale *= 1.2;
  }

  return {
    name: base.name,
    maxHp: Math.round(base.hp*hpScale),
    hp: Math.round(base.hp*hpScale),
    dmg: [Math.round(base.dmg[0]*dmgScale), Math.round(base.dmg[1]*dmgScale)],
    def: base.def + Math.floor(tier*0.7),
    tech: !!base.tech,
    elite: !!elite || !!base.elite,
    berserk: !!base.berserk
  };
}

function startCombat(baseEnemy, elite){
  const run = S.run;
  const enemy = scaledEnemy(baseEnemy, run.act, elite, run.hardMode);
  run.combat = { enemy, playerStunned:false, enemyBleed:0, firstHitUsed:false };
  print(`<span class="tag combat">${elite?'ELITE ':''}CONTACT</span> <b class="${elite?'bad':''}">${enemy.name}</b> ${elite?'blocks your path.':'steps out of the shadows.'} <span class="flavor">HP ${enemy.hp}</span>`, 'sys');
  refreshStatus();
  combatMenu();
}

function getEvadeChance(P){
  return Math.min(
    0.95,
    0.65 +
    ((P.cool||0) * 0.015) +
    (hasRelic(P,'ghost_runner') ? 0.15 : 0) +
    (hasRelic(P,'combat_predictor') ? 0.08 : 0)
  );
}

function combatMenu(){
  const P = S.run.player;
  const c = S.run.combat;
  if(!c) return;
  const ab = P.ability;
  const affinity = getClassWeaponAffinity(P);
  actions([
    { label:'Attack', sub:`${P.weapon.name}${affinity?' • AFFINITY':''}`, fn:()=>playerAttack(false) },
    { label: ab.cdLeft>0 ? `${ab.name} (cd ${ab.cdLeft})` : ab.name, sub: ab.desc, disabled: ab.cdLeft>0, cls:'gold', fn:()=>playerAttack(true) },
    { label:'Use Stim', sub:`Heal ${hasRelic(P,'medtech_patch') ? '35' : '25'}% HP (${P.items.stims} left)`, disabled: P.items.stims<=0, fn:()=>useStim() },
    { label:'Switch Weapon', sub: P.inventory.length>1 ? 'Choose from inventory' : 'No other weapons', disabled: P.inventory.length<=1, fn:()=>switchWeaponMenu() },
    { label:'Guard', sub:`Reduce the next incoming hit by ${hasRelic(P,'guardian_daemon') ? '65' : '50'}%`, cls:'gold', fn:()=>guardAction() },
    { label:'Evade', sub:`${Math.round(getEvadeChance(P)*100)}% chance to avoid the next attack`, fn:()=>evadeAction() },
  ]);
}

function switchWeaponMenu(){
  const P = S.run.player;
  const opts = P.inventory.map((w,i)=>({
    label:(w===P.weapon?'[Equipped] ':'')+w.name,
    sub:`${w.dmg[0]}-${w.dmg[1]} dmg, crit ${Math.round(w.crit*100)}%${w.mutation?' ⟨'+w.mutation.name+'⟩':''}`,
    fn:()=>{ P.weapon=w; print(`Switched to <b>${w.name}</b>.`); combatMenu(); }
  }));

  if(P.inventory.length>1){
    opts.push({
      label:'Drop Weapon',
      sub:'Discard a weapon from your inventory',
      cls:'danger',

function dropWeaponMenu(){
  const P = S.run.player;

  if(P.inventory.length<=1){
    print('You cannot drop your last weapon.', 'warn');

function useStim(){
  const P = S.run.player;
  P.items.stims--;
  const healPct = hasRelic(P,'medtech_patch') ? 0.35 : 0.25;
  const heal = Math.round(P.maxHp*healPct);
  P.hp = clamp(P.hp+heal, 0, P.maxHp);
  print(`<span class="tag hack">STIM</span> <span class="good">+${heal} HP.</span>`);
  refreshStatus();

function guardAction(){
  const P = S.run.player;
  const c = S.run.combat;
  if(!c) return;

  const guardPct = hasRelic(P,'guardian_daemon') ? 65 : 50;
  c.guarding = true;
  c.evading = false;
  c.guardReduction = guardPct/100;

  print(
    `<span class="tag hack">GUARD</span> You brace for impact. ` +
    `<span class="good">The next incoming hit will be reduced by ${guardPct}%.</span>`
  );

  enemyTurn();
}

function evadeAction(){
  const P = S.run.player;
  const c = S.run.combat;
  if(!c) return;

  c.evading = true;
  c.guarding = false;
  c.evadeChance = getEvadeChance(P);

  print(
    `<span class="tag hack">EVADE</span> You shift your stance and prepare to move. ` +
    `<span class="accent">${Math.round(c.evadeChance*100)}% chance to avoid the next attack.</span>`
  );

  enemyTurn();
}

function applyHitEffects(P, c, dmgDealt, isCrit){
  const mut = P.weapon.mutation;
  let extra = '';
  if(mut){
    if(mut.id==='bleed'){ const b=Math.round(dmgDealt*0.2); c.enemyBleed=(c.enemyBleed||0)+b; }
    if(mut.id==='vampiric'){ const h=Math.round(dmgDealt*0.15); P.hp=clamp(P.hp+h,0,P.maxHp); extra+=` <span class="good">+${h} HP leeched.</span>`; }
    if(mut.id==='shock' && Math.random()<0.15){ c.enemyStunned=true; extra+=' <span class="warn">Target stunned!</span>'; }
    if(mut.id==='shred'){ c.enemy.def=Math.max(0,c.enemy.def-1); }
  }
  if(isCrit && hasRelic(P,'bloodwire')){ P.hp=clamp(P.hp+2,0,P.maxHp); extra+=' <span class="good">+2 HP (Bloodwire).</span>'; }
  return extra;
}

function playerAttack(useAbility){
  const P = S.run.player;
  const c = S.run.combat;
  const berserkMode = P.humanity <= P.maxHumanity*0.25 && Math.random()<0.3;

  const affinity = getClassWeaponAffinity(P);
  let hits = (P.weapon.hits || 1) + (P.weapon.mutation && P.weapon.mutation.id==='fragment' ? 1 : 0);
  let totalDmg = 0, anyCrit=false, effectsHtml='';

  if(useAbility){
    const ab = P.ability;
    ab.cdLeft = Math.max(0, ab.cd - Math.max(0,P.cdrBonus));
    ab.ready = false;
    if(P.cls==='netrunner'){
      const targetScale = Math.max(1, Math.round(c.enemy.maxHp*0.08));
      let d = rnd(6,11) + P.tech + P.dmgBonus + targetScale;
      totalDmg = d;
      const stunChance = Math.min(0.50, 0.25 + P.tech*0.02);
      const stunned = Math.random() < stunChance;
      c.enemy.def = Math.max(0, c.enemy.def-1);
      print(`<span class="tag hack">QUICKHACK</span> You breach ${c.enemy.name}'s ICE for <b>${totalDmg}</b> tech damage (armor ignored). <span class="accent">Armor -1.</span>${stunned?' <span class="warn">Target stunned — skips next attack.</span>':''}`);
      c.enemy.hp -= totalDmg;
      c.enemyStunned = stunned;
    } else if(P.cls==='chrome'){
      const missing = 1-(P.hp/P.maxHp);
      let d = rnd(...P.dmgRange) + Math.round(missing*10) + P.dmgBonus - c.enemy.def;
      d = Math.max(1,d);
      P.humanity = clamp(P.humanity-3,0,P.maxHumanity);
      print(`<span class="tag crit">BERSERK</span> Rage fuels the chrome. <b>${d}</b> damage. <span class="warn">-3 Humanity.</span>`);
      c.enemy.hp -= d; totalDmg=d;
      checkCyberpsychosis(P);
    } else if(P.cls==='samurai'){
      let d = rnd(...P.dmgRange) + P.dmgBonus - c.enemy.def; d=Math.max(1,d)*2;
      print(`<span class="tag crit">BLADE DANCE</span> Guaranteed critical — <b>${d}</b> damage, then a follow-up strike!`);
      c.enemy.hp -= d;
      let d2 = Math.max(1, Math.round((rnd(...P.dmgRange)+P.dmgBonus-c.enemy.def)*0.6));
      c.enemy.hp -= d2;
      print(`Follow-up strike: <b>${d2}</b> more damage.`);
      totalDmg = d+d2;
    } else if(P.cls==='rocker'){
      P.dmgBonus += 2; P.def += 1; P.cool += 2; c.rallyTurns = 3 + (P._rallyBonusTurn||0);
      print(`<span class="tag hack">RALLY CRY</span> Adrenaline and distortion pedals. <span class="good">+2 dmg, +1 def, +2 cool for ${c.rallyTurns} turns.</span>`);
    } else if(P.cls==='nomad'){
      c.guaranteedLoot = true;
      print(`<span class="tag hack">SCAVENGER INSTINCT</span> You mark this kill for salvage. Guaranteed bonus loot after the fight.`);
    } else if(P.cls==='fixer'){
      let d = rnd(5,8) + P.tech + P.cool + P.dmgBonus;
      d = Math.max(1,d);
      c.enemy.hp -= d;
      totalDmg = d;
      c.contractBonus = Math.max(c.contractBonus||0, 0.25);
      print(`<span class="tag hack">CONNECTIONS</span> A contact paints the target from off-grid. <b>${d}</b> armor-piercing damage. <span class="good">Target marked: +25% eddies on kill.</span>`);
    } else {
      let d = Math.round((rnd(...P.dmgRange)+P.dmgBonus)*1.6) - Math.max(0,c.enemy.def-2);
      d = Math.max(1,d);
      print(`<span class="tag crit">OVERWATCH</span> Combat reflexes kick in. <b>${d}</b> damage, armor mostly bypassed.`);
      c.enemy.hp -= d; totalDmg=d;
    }
  } else {
    const armorPerHit = hits>1 ? Math.ceil(c.enemy.def / hits) : c.enemy.def;
    for(let i=0;i<hits;i++){
      let base = rnd(...P.weapon.dmg) + P.dmgBonus + (P.weapon.tech?P.tech:0);
      if(affinity){
        base += (affinity.techBonus||0) + (affinity.flatDamage||0);
        if(affinity.damageMult) base = Math.round(base * affinity.damageMult);
      }
      if(hasRelic(P,'adrenal_plug') && P.hp < P.maxHp*0.3) base += 3;
      let critChance = P.weapon.crit + P.critBonus + (affinity?.critBonus||0) + (berserkMode?0.25:0);
      let crit = Math.random() < critChance;
      if(i===0 && !c.firstHitUsed && hasRelic(P,"widows_kiss")){ crit=true; c.firstHitUsed=true; }
      let d = crit ? Math.round(base*1.8) : base;
      d = Math.max(1, d - armorPerHit);
      c.enemy.hp -= d; totalDmg += d; anyCrit = anyCrit||crit;
      effectsHtml += applyHitEffects(P, c, d, crit);
    }
    print(`<span class="tag${anyCrit?' crit':''}">HIT</span> ${P.weapon.name} deals <b>${totalDmg}</b> damage${hits>1?` across ${hits} shots`:''}.${affinity?' <span class="accent">CLASS AFFINITY</span>':''}${anyCrit?' <span class="warn">CRITICAL!</span>':''}${berserkMode?' <span class="bad">(chrome-fueled rage)</span>':''}${effectsHtml}`);
  }

  refreshStatus();
  if(c.enemy.hp <= 0) return winCombat();
  enemyTurn();
}

function enemyTurn(){
  const P = S.run.player; const c = S.run.combat;
  if(!c) return;

  if(c.enemyBleed>0){
    c.enemy.hp -= c.enemyBleed;
    print(`<span class="tag">BLEED</span> ${c.enemy.name} takes <b>${c.enemyBleed}</b> bleed damage.`);
    c.enemyBleed = 0;
    refreshStatus();
    if(c.enemy.hp<=0) return winCombat();
  }

  if(c.enemyStunned){
    print(`<b>${c.enemy.name}</b> is stunned and skips its turn.`);
    c.enemyStunned=false;
  }
  else{
    let d = rnd(...c.enemy.dmg) - Math.floor(P.def);

    if(c.enemy.berserk && c.enemy.hp < c.enemy.maxHp*0.4){
      d = Math.round(d*1.5);
    }

    let avoided = false;

    if(c.evading){
      const evadeChance = c.evadeChance || 0.65;

      if(Math.random() < evadeChance){
        print(
          `<span class="tag hack">EVADE</span> You slip past ` +
          `<b>${c.enemy.name}</b>'s attack completely.`,
          'good'
        );
        d = 0;
        avoided = true;
      } else {
        print(
          `<span class="tag combat">EVADE FAILED</span> ` +
          `<b>${c.enemy.name}</b> tracks your movement.`
        );
      }

      c.evading = false;
      c.evadeChance = 0;
    }

    if(!avoided && Math.random() < P.dodge){
      print(`You dodge <b>${c.enemy.name}</b>'s attack completely.`,'good');
      d = 0;
      avoided = true;
    }

    if(c.guarding && d > 0){
      const original = Math.max(0,d);
      const reduction = c.guardReduction || 0.50;
      d = Math.ceil(original * (1-reduction));

      print(
        `<span class="tag hack">GUARD</span> You absorb the hit. ` +
        `<span class="good">${original} → ${d} damage.</span>`
      );
    }

    c.guarding = false;
    c.guardReduction = 0;
    d = Math.max(0,d);

    if(d>0){
      P.hp = clamp(P.hp-d,0,P.maxHp);
      print(`<b>${c.enemy.name}</b> hits you for <span class="bad">${d}</span>.`);
    }
  }
  if(P.regen>0) P.hp = clamp(P.hp+P.regen, 0, P.maxHp);
  if(c.rallyTurns){ c.rallyTurns--; if(c.rallyTurns<=0){ P.dmgBonus-=2; P.def-=1; P.cool-=2; c.rallyTurns=null; print('Rally Cry fades.', 'flavor'); } }
  if(P.ability.cdLeft>0) P.ability.cdLeft--;
  refreshStatus();
  if(checkDeath()) return;
  combatMenu();
}

function checkDeath(){
  const P = S.run.player;
  if(P.hp<=0){
    if(hasRelic(P,'second_wind') && !P.usedSecondWind){
      P.usedSecondWind = true; P.hp = 1;
      print(`<span class="tag relic">SECOND WIND</span> <span class="purp">Your relic flatlines instead of you — emergency systems kick your heart back on. 1 HP.</span>`);
      refreshStatus();
      return false;
    }
    print(`<span class="tag boss">FLATLINED</span> <span class="bad">The world goes dark. Your final signal cuts out somewhere in ${S.run.actName}.</span>`, 'sys');
    endRun(false);
    return true;
  }
  return false;
}

function winCombat(){
  const P = S.run.player; const c = S.run.combat;
  S.run.kills++;
  const rewardTier = S.run.act >= 3 ? S.run.act-1 : S.run.act;
  let eddies = rnd(10,25) + rewardTier*8 + (c.midboss ? 40 : 0);
  eddies = Math.round(
    eddies *
    (S.run.actEddiesMult||1) *
    (hasRelic(P,'loyalty_chip')?1.2:1) *
    (1 + (c.contractBonus||0))
  );
  P.eddies += eddies;
  print(`<span class="tag">DOWN</span> <b>${c.enemy.name}</b> flatlines. <span class="good">+${eddies} eddies.</span>`);

  if(c.enemy.elite){
    S.run.eliteKills++;
    const avail = relicPool().filter(r=>!hasRelic(P,r.id));
    if(avail.length){
      const opts3 = avail.sort(()=>Math.random()-0.5).slice(0,3);
      print(`<span class="tag relic">ELITE DROP</span> Choose a relic to take from the wreckage:`);
      const list = opts3.map(r=>({ label:r.name, sub:r.desc, cls:'purp', fn:()=>{ grantRelic(P,r); divider(); actions([{label:'Move on', fn:()=>advance()}],{single:true}); } }));
      list.push({ label:'Skip — none of these', fn:()=>{ divider(); actions([{label:'Move on', fn:()=>advance()}],{single:true}); } });
      actions(list);
      refreshStatus();
      return;
    }
  }

  const lootChance = 0.35 + (hasRelic(P,'scavenger_eye') ? 0.15 : 0);
  if(c.guaranteedLoot || Math.random()<lootChance){
    if(Math.random()<0.5){
      const w = rollWeapon(pick(Object.keys(WEAPON_BASE)), c.enemy.elite?rnd(3,6):undefined);
      addToInventory(P,w);
      print(`<span class="tag loot">SALVAGE</span> Looted <b>${w.name}</b>.`);
    } else {
      const cwChoices = cyberwarePool().filter(x=>!P.cyberware.includes(x));
      if(cwChoices.length){
        const cw = pick(cwChoices);
        print(`<span class="tag loot">SALVAGE</span> Found cyberware: <b>${cw.name}</b>.`);
        actions([
          { label:`Install ${cw.name}`, sub:cw.desc+` (-${cw.hum} Humanity)`, cls:'gold', fn:()=>{ installCyberware(P,cw,false); divider(); advance(); } },
          { label:'Leave it — not worth the Humanity', fn:()=>{ divider(); advance(); } },
        ]);
        refreshStatus();
        return;
      }
    }
  }
  refreshStatus();
  divider();
  actions([{ label:'Move on', fn:()=>advance() }], {single:true});
}

function startBossFight(){
  const run = S.run;
  const heatBonus = 1 + (run.heat||0)*0.1;
  const hardBonus = run.hardMode ? 1.2 : 1;
  const boss = {
    name:'Adam Smasher', maxHp: Math.round(150*heatBonus*hardBonus), hp: Math.round(150*heatBonus*hardBonus),
    dmg:[10,16], def:6, phase:1, elite:true, boss:true
  };
  run.combat = { enemy: boss, boss:true, enemyBleed:0, firstHitUsed:false };
  refreshStatus();
  combatMenu();
}

const _origWinCombat = winCombat;
winCombat = function(){
  const c = S.run.combat;
  if(c.boss){
    if(c.enemy.phase===1 && c.enemy.hp <= c.enemy.maxHp*0.5 && c.enemy.hp>0){
      c.enemy.phase=2; c.enemy.dmg=[c.enemy.dmg[0]+3, c.enemy.dmg[1]+4];
      print(`<span class="tag boss">PHASE 2</span> Smasher's chassis vents smoke. "Now we're talking." <span class="bad">His attacks hit harder.</span>`);
      refreshStatus();
      return enemyTurn();
    }
    if(c.enemy.hp<=0){
      print(`<span class="tag boss">FLATLINE — CONFIRMED</span> <span class="good">Adam Smasher hits the floor. For one silent second, Night City feels almost survivable.</span>`);
      return endRun(true);
    }
    refreshStatus();
    return enemyTurn();
  }
  return _origWinCombat();
};

// ================= END OF RUN =================
function creditsForRun(run, won){
  const base = [8, 16, 26, 34, 46][run.act] || 8;
  let c = base + run.eliteKills*3 + (won ? 45 : 0);
  if(run.hardMode) c = Math.round(c*1.5);
  return c;
}

async function endRun(won){
  setStatus(false);
  S.run.over=true;
  actionsEl.innerHTML='';
  const P = S.run.player;
  const run = S.run;

  META.bestDistrict = Math.max(META.bestDistrict, run.act+1);
  const earnedCredits = creditsForRun(run, won);
  META.credits += earnedCredits;
  if(!META.mastery[P.cls]) META.mastery[P.cls] = {kills:0, wins:0};
  META.mastery[P.cls].kills += run.kills;
  if(won) { META.runsWon++; META.mastery[P.cls].wins += 1; }
  META.log.unshift({ won, cls:P.className, district: won?'Arasaka Tower':run.actName, eddies:P.eddies, credits:earnedCredits, date:new Date().toISOString().slice(0,10) });
  META.log = META.log.slice(0,10);
  await saveMeta();

  divider();
  print(won
    ? `<span class="good">RUN COMPLETE. You walked out of Arasaka Tower. Not everyone does.</span>`
    : `<span class="bad">RUN OVER.</span> You reached <b>${run.actName}</b> as a <b>${P.className}</b>, banked ${P.eddies} eddies before the flatline.`
  );
  print(`<span class="purp">+${earnedCredits} credits</span> earned for the Fixer Network. <span class="flavor">Legend record: ${META.runsWon} wins / ${META.runsStarted} runs.</span>`);
  actions([
    { label:'New run', cls:'gold', fn:()=>showClassSelect() },
    { label:'Main menu', fn:()=>showTitle() },
  ]);
}
function victory(){ endRun(true); }

// ================= META SHOP =================
function buildShopCatalog(){
  const items = [];
  const lockedRelics = ALL_RELICS.filter(r=>!META.unlocks.relics.includes(r.id));
  lockedRelics.forEach((r,i)=> items.push({ id:'relic_'+r.id, kind:'relic', name:'Unlock Relic: '+r.name, desc:r.desc, cost:70+i*30 }));
  const lockedMut = ALL_MUTATIONS.filter(m=>!META.unlocks.mutations.includes(m.id));
  lockedMut.forEach((m,i)=> items.push({ id:'mut_'+m.id, kind:'mutation', name:'Unlock Mutation: '+m.name, desc:m.desc, cost:60+i*25 }));
  const lockedCw = CYBERWARE.filter(c=>!META.unlocks.cyberware.includes(c.id));
  lockedCw.forEach((c,i)=> items.push({ id:'cw_'+c.id, kind:'cyber', name:'Unlock Cyberware: '+c.name, desc:c.desc, cost:90+i*30 }));

  const perks = [
    { id:'perk_maxhp_1', name:'Combat Conditioning I', desc:'+3 max HP, all classes, permanently.', cost:100 },
    { id:'perk_maxhp_2', name:'Combat Conditioning II', desc:'+3 max HP, all classes, permanently.', cost:190, requires:'perk_maxhp_1' },
    { id:'perk_maxhp_3', name:'Combat Conditioning III', desc:'+3 max HP, all classes, permanently.', cost:280, requires:'perk_maxhp_2' },
    { id:'perk_stim', name:'Extra Stim Reserve', desc:'Start every run with 2 stims instead of 1.', cost:140 },
    { id:'perk_eddies', name:'Starting Capital', desc:'Start every run with +25 eddies.', cost:110 },
    { id:'perk_overwatch', name:'Unlock Overwatch Mode', desc:'New Game+ difficulty: tougher enemies, 1.5x credits & bigger payouts. Requires at least 1 win.', cost:260, requires:'win' },
  ];
  perks.forEach(p=>{
    if(META.purchased.includes(p.id)) return;
    if(p.requires==='win' && META.runsWon<1) return;
    if(p.requires && p.requires!=='win' && !META.purchased.includes(p.requires)) return;
    items.push({ id:p.id, kind:'perk', name:p.name, desc:p.desc, cost:p.cost });
  });
  return items;
}

function showMetaShop(){
  log.innerHTML='';
  print(`<span class="tag purp">FIXER NETWORK — BLACK MARKET</span> Spend Credits earned across runs on permanent unlocks. <span class="purp">You have ${META.credits} credits.</span>`, 'sys');
  render();
  function render(){
    const catalog = buildShopCatalog();
    if(!catalog.length){ print('Every contact you know has nothing left to sell you. You\'ve bought it all.', 'flavor'); }
    const opts = catalog.map(it=>({
      label: it.name, sub: `${it.desc} — ${it.cost}cr`, cls:'purp', disabled: META.credits<it.cost,
      fn: async ()=>{
        META.credits -= it.cost;
        if(it.kind==='relic') META.unlocks.relics.push(it.id.replace('relic_',''));
        if(it.kind==='mutation') META.unlocks.mutations.push(it.id.replace('mut_',''));
        if(it.kind==='cyber') META.unlocks.cyberware.push(it.id.replace('cw_',''));
        if(it.kind==='perk') META.purchased.push(it.id);
        await saveMeta();
        log.innerHTML='';
        print(`<span class="tag purp">FIXER NETWORK — BLACK MARKET</span> Spend Credits earned across runs on permanent unlocks. <span class="purp">You have ${META.credits} credits.</span>`, 'sys');
        print(`<span class="good">Purchased: ${it.name}.</span>`);
        render();
      }
    }));
    opts.push({ label:'Back to title', fn:()=>showTitle() });
    actions(opts);
  }
}

    { label:'Class Mastery', sub:'View mastery progress', fn:()=>showMastery() },
    { label:'Run History', sub: META.log.length?`${META.log.length} recent runs`:'No runs yet', disabled: !META.log.length, fn:()=>showHistory() },
    { label:'Switch Save File', fn:()=>showSaveSelect() },
  ]);
}

function showClassSelect(hardMode){
  hardMode = !!hardMode;
  const overwatchUnlocked = META.purchased.includes('perk_overwatch');
  log.innerHTML='';
  print('<span class="tag">CHARACTER CREATION</span> Choose your build. Stats roll with small variance each run — no two mercs are identical.', 'sys');
  if(overwatchUnlocked){
    print(`<span class="tag purp">OVERWATCH MODE</span> unlocked — tougher enemies, 1.5x credit payout. Currently <b class="${hardMode?'bad':'good'}">${hardMode?'ON':'OFF'}</b>. Toggle below, then pick a class.`);
  }
  const wrap = document.createElement('div');
  wrap.className='cardgrid';
  CLASSES.forEach(c=>{
    const m = META.mastery[c.id] || {kills:0,wins:0};
    const div = document.createElement('div');
    div.className='card';
    div.innerHTML = `<h3>${c.name} ${m.wins>=MASTERY_WINS_T3?'<span class="purp">★</span>':''}</h3><div>${c.tagline}</div>
      <div class="stats">HP <b>${c.hp}</b> · DMG <b>${c.dmg[0]}-${c.dmg[1]}</b> · DEF <b>${c.def}</b> · TECH <b>${c.tech}</b> · COOL <b>${c.cool}</b> · HUMANITY <b>${c.humanity}</b><br>
      Weapon: <b>${WEAPON_BASE[c.weapon].name}</b> · Ability: <b>${c.ability.name}</b> — ${c.ability.desc}<br>
      Affinity: <b>${CLASS_WEAPON_AFFINITY[c.id].name}</b> — ${CLASS_WEAPON_AFFINITY[c.id].desc}<br>Mastery: ${m.kills} kills / ${m.wins} wins</div>`;
    div.onclick = ()=>{
      const clone = JSON.parse(JSON.stringify(c));
      clone.hp += rnd(-3,3); clone.def += rnd(0,1); clone.cool += rnd(-1,1);
      startRun(clone, hardMode);
    };
    wrap.appendChild(div);
  });
  log.appendChild(wrap);
  if(overwatchUnlocked){
    actions([{ label: hardMode?'Turn Overwatch Mode OFF':'Turn Overwatch Mode ON', cls:hardMode?'':'danger', fn:()=>showClassSelect(!hardMode) }], {single:true});
  } else {
    actionsEl.innerHTML='';
  }
}

// ================= BOOT =================
(async function boot(){
  await showSaveSelect();
})();
</script>
