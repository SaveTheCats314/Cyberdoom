<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#040507">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Cyberdoom</title>
  <link rel="stylesheet" href="autoplay.css">
  <link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-title" content="Cyberdoom">
<meta name="application-name" content="Cyberdoom">
<style>
  :root{
    --bg:#040507;
    --panel:#0a0d12;
    --panel2:#0f141b;
    --line:#1c2632;
    --text:#c3d0da;
    --dim:#54687a;
    --magenta:#ff2e88;
    --cyan:#2fe6e0;
    --amber:#ffb020;
    --red:#ff4757;
    --green:#3dff9a;
    --purple:#b26bff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; background:var(--bg);}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Courier New', ui-monospace, 'SF Mono', Menlo, monospace;
    font-size:15px; line-height:1.45;
    overscroll-behavior:none;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
#app{
  width:100%;
  max-width:640px;
  height:100dvh;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
  #hdr{
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  flex:0 0 auto;
  background:rgba(4,5,7,0.97);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  z-index:5;
}
  }
  #hdr .title{color:var(--cyan); font-weight:bold; letter-spacing:1px; font-size:14px;}
  #hdr .title span{color:var(--magenta);}
  #hdr .sub{color:var(--purple); font-size:11px;}
#hdr.run-hidden{
  display:none;
}
  #status{
  display:none;
  flex:0 0 auto;
  padding:8px 12px 10px;
  border-bottom:1px solid var(--line);
  background:rgba(7,10,14,0.98);
  font-size:12px;
}

#status.on{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.hudTop{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
}

.hudClass{
  color:var(--cyan);
  font-weight:bold;
  letter-spacing:1px;
  font-size:12px;
}

.hudDistrict{
  color:var(--dim);
  text-align:center;
  font-size:11px;
  letter-spacing:.5px;
}

.hudMoney{
  color:var(--amber);
  text-align:right;
}

.hudMoney b{
  color:var(--amber);
}

.hudMeters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.hudMeter{
  min-width:0;
}

.hudMeterHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
  color:var(--dim);
  font-size:10px;
  letter-spacing:1px;
}

.hudMeterHead b{
  color:var(--text);
  font-size:11px;
}

.hudBar{
  width:100%;
  height:7px;
  background:#141b23;
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
}

.hudBar > i{
  display:block;
  height:100%;
  width:100%;
  transition:width .18s ease-out, background .18s ease-out;
}

#barHp{
  background:var(--green);
}

#barHum{
  background:var(--cyan);
}

  #enemyStatus{
  display:none;
  flex:0 0 auto;
  padding:9px 12px 10px;
  border-bottom:1px solid rgba(255,71,87,0.35);
  background:
    linear-gradient(
      90deg,
      rgba(255,71,87,0.07),
      rgba(255,46,136,0.025)
    ),
    #07090d;
}

#enemyStatus.on{
  display:block;
}

.enemyTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:6px;
}

#enemyName{
  color:var(--red);
  font-size:12px;
  font-weight:bold;
  letter-spacing:.7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.enemyBadges{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  flex:0 0 auto;
}

#enemyThreat{
  flex:0 0 auto;
  border:1px solid var(--line);
  border-radius:3px;
  padding:1px 5px;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
}

#enemyThreat.street{
  color:var(--green);
  border-color:rgba(61,255,154,0.45);
}

#enemyThreat.dangerous{
  color:var(--amber);
  border-color:rgba(255,176,32,0.55);
}

#enemyThreat.lethal{
  color:var(--red);
  border-color:rgba(255,71,87,0.7);
  box-shadow:0 0 8px rgba(255,71,87,0.12);
}

#enemyType{
  flex:0 0 auto;
  color:var(--dim);
  border:1px solid var(--line);
  border-radius:3px;
  padding:1px 5px;
  font-size:9px;
  letter-spacing:1px;
}

#enemyType.elite{
  color:var(--amber);
  border-color:rgba(255,176,32,0.5);
}

#enemyType.boss{
  color:var(--magenta);
  border-color:rgba(255,46,136,0.6);
  font-weight:bold;
}

.enemyHpHead{
  display:flex;
  justify-content:space-between;
  color:var(--dim);
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:3px;
}

.enemyHpHead b{
  color:var(--text);
}

.enemyBar{
  width:100%;
  height:8px;
  overflow:hidden;
  border:1px solid rgba(255,71,87,0.35);
  border-radius:4px;
  background:#14161c;
}

.enemyBar > i{
  display:block;
  width:100%;
  height:100%;
  background:var(--red);
  transition:width .18s ease-out, background .18s ease-out;
}

.enemyDetails{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  margin-top:6px;
  color:var(--dim);
  font-size:9px;
  letter-spacing:.6px;
}

.enemyDetails > span:last-child{
  text-align:right;
}

.enemyDetails b{
  color:var(--text);
}

#enemyEffects{
  text-align:center;
  color:var(--amber);
  white-space:nowrap;
}
  
#log{
  flex:1 1 auto;
  min-height:0;
  padding:14px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
  .entry{margin-bottom:14px; animation:fadein .18s ease-out;}
  @keyframes fadein{from{opacity:0; transform:translateY(2px);} to{opacity:1; transform:none;}}
  .entry p{margin:0 0 6px 0;}
  .sys{color:var(--dim);}
  .tag{display:inline-block; font-size:10px; letter-spacing:1px; padding:1px 6px; border:1px solid var(--line); border-radius:3px; margin-right:6px; color:var(--dim);}
  .tag.combat{border-color:var(--red); color:var(--red);}
  .tag.hack{border-color:var(--cyan); color:var(--cyan);}
  .tag.loot{border-color:var(--amber); color:var(--amber);}
  .tag.crit{border-color:var(--magenta); color:var(--magenta);}
  .tag.boss{border-color:var(--magenta); color:var(--magenta); font-weight:bold;}
  .tag.relic{border-color:var(--purple); color:var(--purple);}
  .flavor{color:var(--dim); font-style:italic;}
  .accent{color:var(--cyan);}
  .warn{color:var(--amber);}
  .bad{color:var(--red);}
  .good{color:var(--green);}
  .purp{color:var(--purple);}
  .divider{border:none; border-top:1px dashed var(--line); margin:14px 0;}

  #actions{
    flex:0 0 auto; border-top:1px solid var(--line); padding:10px; display:grid; gap:8px;
    grid-template-columns:1fr 1fr; background:var(--panel);
  }
  #actions.single{grid-template-columns:1fr;}

  #app.metaShopOpen #log{
    flex:0 0 auto;
    max-height:24dvh;
    overflow-y:auto;
  }

  #app.metaShopOpen #actions{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    align-content:start;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }

  button.act{
    font-family:inherit; font-size:13.5px; text-align:left; color:var(--text);
    background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    padding:11px 12px; cursor:pointer;
  }
  button.act:active{background:#161f29; border-color:var(--cyan); transform:scale(0.99);}
  button.act .k{color:var(--cyan); margin-right:6px;}
  button.act.danger .k{color:var(--red);}
  button.act.gold .k{color:var(--amber);}
  button.act.purp .k{color:var(--purple);}
  button.act:disabled{opacity:0.32;}
  button.act small{display:block; color:var(--dim); font-size:11px; margin-top:2px;}

  .hudSheetBtn{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background:transparent;
    padding:0;
    margin:0;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
  }
  .hudSheetBtn::after{
    content:'  ▾';
    color:var(--dim);
    font-size:9px;
  }

  .sheetOverlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(2,4,7,0.94);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheetOverlay.on{display:flex;}
  .sheetPanel{
    width:100%;
    max-width:640px;
    height:100%;
    margin:0 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--bg);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    padding:14px;
  }
  .sheetHead{
    position:sticky;
    top:0;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 0 12px;
    margin-bottom:10px;
    background:rgba(4,5,7,0.97);
    border-bottom:1px solid var(--line);
  }
  .sheetHead h2{
    margin:2px 0 0;
    color:var(--cyan);
    font-size:18px;
    letter-spacing:1px;
  }
  .sheetEyebrow{
    color:var(--dim);
    font-size:9px;
    letter-spacing:1.5px;
  }
  #sheetClose{
    width:40px;
    height:40px;
    flex:0 0 auto;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel2);
    color:var(--text);
    font-family:inherit;
    font-size:24px;
    line-height:1;
  }
  .sheetSection{
    margin:0 0 12px;
    padding:11px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--panel);
  }
  .sheetSection h3{
    margin:0 0 8px;
    color:var(--magenta);
    font-size:11px;
    letter-spacing:1.2px;
  }
  .sheetStatGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
  }
  .sheetStat{
    padding:7px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--panel2);
    min-width:0;
  }
  .sheetStat span{
    display:block;
    color:var(--dim);
    font-size:8px;
    letter-spacing:.8px;
  }
  .sheetStat b{
    display:block;
    margin-top:2px;
    color:var(--text);
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sheetItem{
    padding:8px 0;
    border-top:1px dashed var(--line);
  }
  .sheetItem:first-of-type{border-top:0; padding-top:0;}
  .sheetItem:last-child{padding-bottom:0;}
  .sheetItem b{color:var(--text);}
  .sheetItem small{
    display:block;
    margin-top:2px;
    color:var(--dim);
    font-size:10px;
  }
  .sheetAffinity{
    padding:9px;
    border:1px solid rgba(47,230,224,0.35);
    border-radius:6px;
    background:rgba(47,230,224,0.05);
  }
  .sheetAffinity.inactive{
    border-color:var(--line);
    background:var(--panel2);
    opacity:.72;
  }
  .sheetEmpty{color:var(--dim); font-style:italic;}
  .sheetEquipped{color:var(--green); font-size:9px; letter-spacing:1px;}
  .sheetWeaponRow{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .sheetWeaponInfo{min-width:0; flex:1 1 auto;}
  .sheetDrop{
    flex:0 0 auto;
    border:1px solid rgba(255,71,87,0.45);
    border-radius:5px;
    background:rgba(255,71,87,0.06);
    color:var(--red);
    font-family:inherit;
    font-size:9px;
    letter-spacing:.8px;
    padding:6px 8px;
    cursor:pointer;
  }
  .sheetDrop:disabled{
    opacity:.28;
    cursor:default;
  }

  .hudNameplate{
    display:inline-block;
    margin-right:4px;
    padding:1px 4px;
    border:1px solid rgba(178,107,255,0.45);
    border-radius:3px;
    color:var(--purple);
    font-size:8px;
    letter-spacing:.7px;
    vertical-align:1px;
  }
  .hudNameplate.legendary{
    color:var(--magenta);
    border-color:rgba(255,46,136,0.65);
    box-shadow:0 0 8px rgba(255,46,136,0.12);
  }
  .masteryReward{
    padding:5px 0;
    color:var(--dim);
    font-size:10px;
  }
  .masteryReward.unlocked{color:var(--text);}
  .masteryPlate{
    display:inline-block;
    margin-left:5px;
    padding:1px 5px;
    border:1px solid rgba(178,107,255,0.45);
    border-radius:3px;
    color:var(--purple);
    font-size:9px;
    letter-spacing:.8px;
  }
  .masteryPlate.legendary{
    color:var(--magenta);
    border-color:rgba(255,46,136,0.65);
  }

  .guideLead{
    margin:0 0 12px;
    padding:11px;
    border:1px solid rgba(47,230,224,0.35);
    border-radius:7px;
    background:rgba(47,230,224,0.05);
    color:var(--text);
  }
  .guideLead b{color:var(--cyan);}
  .guideRow{
    padding:7px 0;
    border-top:1px dashed var(--line);
    font-size:11px;
  }
  .guideRow:first-of-type{border-top:0; padding-top:0;}
  .guideRow b{color:var(--cyan);}
  .guideRow strong{color:var(--amber);}
  .guideTip{
    margin-top:8px;
    padding:8px;
    border-left:2px solid var(--purple);
    background:rgba(178,107,255,0.05);
    color:var(--dim);
    font-size:10px;
  }
  .guideOpenBtn{
    width:100%;
    border:1px solid rgba(47,230,224,0.4);
    border-radius:6px;
    background:rgba(47,230,224,0.06);
    color:var(--cyan);
    font-family:inherit;
    font-size:11px;
    letter-spacing:.5px;
    padding:10px;
    cursor:pointer;
    text-align:left;
  }
  .guideOpenBtn small{
    display:block;
    margin-top:3px;
    color:var(--dim);
    font-size:9px;
    letter-spacing:0;
  }

  .cardgrid{display:grid; gap:10px;}
  .card{border:1px solid var(--line); background:var(--panel2); border-radius:8px; padding:12px; cursor:pointer;}
  .card:active{border-color:var(--cyan);}
  .card h3{margin:0 0 4px 0; color:var(--magenta); font-size:14.5px;}
  .card .stats{color:var(--dim); font-size:11.5px; margin-top:6px;}
  .card .stats b{color:var(--cyan);}
  .card.locked{opacity:0.45; cursor:default;}

  #titleScreen{padding:20px 16px; text-align:center;}
  #titleScreen h1{color:var(--magenta); font-size:26px; letter-spacing:2px; margin:26px 0 4px;}
  #titleScreen h1 span{color:var(--cyan);}
  #titleScreen p.tagline{color:var(--dim); margin-bottom:26px; font-size:12px; letter-spacing:1px;}
  #titleScreen .meta{color:var(--dim); font-size:11.5px; margin-top:22px;}

  .mbar{height:8px; background:#141b23; border-radius:4px; overflow:hidden; margin:4px 0 8px;}
  .mbar > i{display:block; height:100%; background:var(--purple);}

  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--line);}
</style>
</head>
<body>
  <div id="runtime-error" style="
    display:none;
  position:fixed;
  z-index:999999;
  top:0;
  left:0;
  right:0;
  max-height:100vh;
  overflow:auto;
  background:#08000a;
  color:#ff4d6d;
  padding:20px;
  font-family:monospace;
  font-size:14px;
  white-space:pre-wrap;
  box-sizing:border-box;
"></div>

<script>
window.onerror = function(message, source, lineno, colno, error) {
  const box = document.getElementById('runtime-error');
  if (box) {
   
    box.style.display = 'block';
    
    box.innerHTML =
      '<strong>CYBERDOOM RUNTIME ERROR</strong>\\n\\n' +
      message + '\\n\\n' +
      'Line: ' + lineno + '\\n' +
      'Column: ' + colno + '\\n\\n' +
      (error && error.stack ? error.stack : '');
  }
};
</script>
<div id="app">
  <div id="hdr">
    <div class="title">CYBER<span>DOOM</span></div>
    <div class="sub" id="hdrSub">◈ 0 cr</div>
  </div>
 <div id="status">

  <div class="hudTop">
    <button class="hudClass hudSheetBtn" id="stClass" type="button" onclick="openCharacterSheet()" aria-label="Open character sheet">-</button>

    <span class="hudDistrict" id="stFloor">-</span>

    <span class="hudMoney">
      €$ <b id="stEd">-</b>
    </span>
  </div>

   <div id="enemyStatus">

  <div class="enemyTop">
    <span id="enemyName">HOSTILE</span>
    <div class="enemyBadges">
      <span id="enemyThreat">STREET</span>
      <span id="enemyType">CONTACT</span>
    </div>
  </div>

  <div class="enemyHpHead">
    <span>HP</span>
    <b id="enemyHp">-</b>
  </div>

  <div class="enemyBar">
    <i id="enemyHpBar"></i>
  </div>

  <div class="enemyDetails">
    <span>ARMOR <b id="enemyArmor">-</b></span>
    <span id="enemyEffects"></span>
    <span>DMG <b id="enemyDamage">-</b></span>
  </div>

</div>
 
   <div class="hudMeters">

    <div class="hudMeter">
      <div class="hudMeterHead">
        <span>HP</span>
        <b id="stHp">-</b>
      </div>

      <div class="hudBar">
        <i id="barHp"></i>
      </div>
    </div>

    <div class="hudMeter">
      <div class="hudMeterHead">
        <span>HUMANITY</span>
        <b id="stHum">-</b>
      </div>

      <div class="hudBar">
        <i id="barHum"></i>
      </div>
    </div>

  </div>

</div>

  <div id="charSheet" class="sheetOverlay" aria-hidden="true">
    <div class="sheetPanel">
      <div class="sheetHead">
        <div>
          <div class="sheetEyebrow">RUN // CHARACTER DATA</div>
          <h2 id="sheetTitle">CHARACTER SHEET</h2>
        </div>
        <button id="sheetClose" type="button" onclick="closeCharacterSheet()" aria-label="Close character sheet">×</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="log"></div>
  <div id="actions"></div>
</div>

<script>
/* =====================================================================
   CYBERDOOM v2 — cyberpunk text roguelike
   Relics, weapon mutations, fixer boons, class mastery, dual currency
   (Eddies = in-run, Credits = persistent), multiple save slots.
===================================================================== */

const $ = sel => document.querySelector(sel);
const log = $('#log');
const actionsEl = $('#actions');
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[rnd(0, arr.length-1)];
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));

function print(html, cls){
  const d = document.createElement('div');
  d.className = 'entry' + (cls ? ' '+cls : '');
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight + 999;
  return d;
}
function divider(){ print('<hr class="divider">'); }
function actions(list, opts={}){
  window.CyberdoomBot?.observe(list);
  actionsEl.innerHTML = '';
  actionsEl.className = (list.length<=1 || opts.single) ? 'single' : '';
  list.forEach((a,i)=>{
    const b = document.createElement('button');
    b.className = 'act' + (a.cls ? ' '+a.cls : '');
    b.innerHTML = `<span class="k">${a.key || (i+1)}›</span>${a.label}${a.sub?`<small>${a.sub}</small>`:''}`;
    if(a.disabled) b.disabled = true;
    b.onclick = ()=>{ if(a.disabled) return; window.CyberdoomBot?.pause('Manual control — press Play to resume.'); a.fn(); };
    actionsEl.appendChild(b);
  });
}

function dropWeapon(index){
  if(!S.run || S.run.over) return;

  const P = S.run.player;
  if(!Array.isArray(P.inventory) || P.inventory.length<=1) return;

  const weapon = P.inventory[index];
  if(!weapon) return;

  const wasEquipped = weapon === P.weapon;
  P.inventory.splice(index, 1);

  if(wasEquipped){
    P.weapon = P.inventory[0];
  }

  print(
    `<span class="tag">DROP</span> Left <b>${weapon.name}</b> behind.` +
    (wasEquipped ? ` <span class="accent">Equipped ${P.weapon.name}.</span>` : '')
  );

  refreshStatus();
  renderCharacterSheet();
}

function renderCharacterSheet(){

function getThreatLevel(P, e, c){
  if(e.boss || c.boss){
    return { label:'LETHAL', cls:'lethal' };
  }

  const avgDamage = (e.dmg[0] + e.dmg[1]) / 2;
  const expectedHit = Math.max(0, avgDamage - Math.floor(P.def));
  const hitPressure = expectedHit / Math.max(1, P.maxHp);
  const hpPressure = e.maxHp / Math.max(1, P.maxHp);

  let score =
    (hitPressure * 2.5) +
    (hpPressure * 0.35) +
    (e.def * 0.05);

  if(e.elite) score += 0.5;
  if(e.berserk) score += 0.2;

  if(score >= 1.15){
    return { label:'LETHAL', cls:'lethal' };
  }

  if(score >= 0.5){
    return { label:'DANGEROUS', cls:'dangerous' };
  }

  return { label:'STREET', cls:'street' };
}

function refreshEnemyStatus(){

  const hud = $('#enemyStatus');

  if(
    !S.run ||
    !S.run.combat ||
    !S.run.combat.enemy ||
    S.run.combat.enemy.hp <= 0 ||
    S.run.over
  ){
    hud.classList.remove('on');
    return;
  }

  const c = S.run.combat;
  const e = c.enemy;

  hud.classList.add('on');

  $('#enemyName').textContent = e.name.toUpperCase();

  const threat = getThreatLevel(S.run.player, e, c);
  const threatEl = $('#enemyThreat');
  threatEl.textContent = threat.label;
  threatEl.className = threat.cls;

  const type = $('#enemyType');

  type.className = '';

  if(e.boss || c.boss){
    type.textContent = 'BOSS';
    type.classList.add('boss');
  }
  else if(e.elite){
    type.textContent = 'ELITE';
    type.classList.add('elite');
  }
  else{
    type.textContent = 'CONTACT';
  }

  $('#enemyHp').textContent =
    `${Math.max(0,e.hp)}/${e.maxHp}`;

  const hpPct =
    clamp(e.hp / e.maxHp * 100, 0, 100);

  $('#enemyHpBar').style.width =
    hpPct + '%';

  $('#enemyHpBar').style.background =
    hpPct <= 25
      ? 'var(--magenta)'
      : hpPct <= 50
        ? 'var(--amber)'
        : 'var(--red)';

  $('#enemyArmor').textContent =
    e.def;

  $('#enemyDamage').textContent =
    `${e.dmg[0]}–${e.dmg[1]}`;

  const effects = [];

  if(e.tech)
    effects.push('TECH');

  if(c.enemyBleed > 0)
    effects.push(`BLEED ${c.enemyBleed}`);

  if(c.enemyStunned)
    effects.push('STUNNED');

  if(e.berserk && e.hp < e.maxHp * 0.4)
    effects.push('BERSERK');

  if(e.phase)
    effects.push(`PHASE ${e.phase}`);

  $('#enemyEffects').textContent =
    effects.join(' • ');
}

const SLOTS = 3;
let SLOT = null;
let META = null;
function slotKey(n){ return `meta_v2_slot${n}`; }
const BASE_RELIC_UNLOCKS = [
  'bloodwire','scavenger_eye','ghost_runner','overclock_battery',
  'deadeye_lens','neural_anchor','titanium_spine','reflex_tuner',
  'chrome_heart','medtech_patch','guardian_daemon','combat_predictor'
];

const BASE_CHROME_UNLOCKS = [
  'optics','reflex','plating','arms','legs',
  'bloodpump','smartlink','ramdeck','optical_camo','pain_editor','synlungs'
];

function defaultMeta(){
  return {
    runsStarted:0, runsWon:0, bestDistrict:0, credits:0,
    progressionV3:true,
    mastery:{}, // classId -> {kills:0, wins:0}
    unlocks:{ relics:[...BASE_RELIC_UNLOCKS],
              mutations:['bleed','vampiric'],
              cyberware:[...BASE_CHROME_UNLOCKS] },
    purchased:[], // meta-shop perk ids
    log:[]
  };
}
async function peekSlot(n){
  try{
    const r = localStorage.getItem(slotKey(n));
    if(r) return JSON.parse(r);
  }catch(e){}
  return null;
}
async function loadSlot(n){
  const existing = await peekSlot(n);
  META = existing || defaultMeta();

  META.unlocks = META.unlocks || {};
  META.unlocks.relics = [...new Set([...(META.unlocks.relics||[]), ...BASE_RELIC_UNLOCKS])];
  META.unlocks.cyberware = [...new Set([...(META.unlocks.cyberware||[]), ...BASE_CHROME_UNLOCKS])];
  META.unlocks.mutations = META.unlocks.mutations || ['bleed','vampiric'];

  // Existing saves used district index 3 for Corpo Plaza and 4 for Arasaka Tower.
  if(!META.progressionV3){
    if((META.bestDistrict||0) >= 3) META.bestDistrict += 1;
    META.progressionV3 = true;
  }

  SLOT = n;
  updateHeader();
}
async function saveMeta(){
  if(SLOT==null) return;
  try{
    localStorage.setItem(slotKey(SLOT), JSON.stringify(META));
  }catch(e){
    console.warn('save failed', e);
  }
  updateHeader();
}

function getClassWeaponAffinity(P){
  const baseAffinity = getAffinityDefinition(P);
  if(!baseAffinity || !P.weapon || P.weapon.baseId !== baseAffinity.baseId) return null;

  const affinity = {...baseAffinity};
  if((P.masteryLevel||0) >= 3){
    const bonus = MASTERY_AFFINITY_BONUS[P.cls] || {};
    if(bonus.damageMult) affinity.damageMult = (affinity.damageMult||1) + bonus.damageMult;
    if(bonus.critBonus) affinity.critBonus = (affinity.critBonus||0) + bonus.critBonus;
    if(bonus.techBonus) affinity.techBonus = (affinity.techBonus||0) + bonus.techBonus;
    if(bonus.flatDamage) affinity.flatDamage = (affinity.flatDamage||0) + bonus.flatDamage;
  }
  return affinity;
}

  fixer:     {flatDamage:1, critBonus:0.05},

function getMasteryLevel(m){
  m = m || {kills:0,wins:0};
  let level = 0;
  MASTERY_RANKS.forEach(rank=>{
    if((m.kills||0) >= rank.kills && (m.wins||0) >= rank.wins) level = rank.level;
  });
  return level;
}

function getMasteryRankName(level){
  if(level<=0) return 'Unranked';
  return (MASTERY_RANKS.find(r=>r.level===level)||{}).name || 'Legend';
}

function getMasteryNameplate(clsId, m){
  const level = getMasteryLevel(m);
  const path = MASTERY_PATHS[clsId];
  if(!path) return '';
  if(level>=6) return path.plates[6];
  if(level>=2) return path.plates[2];
  return '';
}

function applyMasteryBonuses(p, clsId, m){
  const level = getMasteryLevel(m);
  const path = MASTERY_PATHS[clsId];
  p.masteryLevel = level;
  p.nameplate = getMasteryNameplate(clsId,m);
  if(!path) return;
  for(let i=1;i<=level;i++){
    const reward = path.rewards[i];
    if(reward && reward.apply) reward.apply(p);
  }
}

  { id:'bleed',    name:'Bleeding Edge',   desc:'Hits cause bleed: 20% of the hit again next turn.' },
  { id:'vampiric', name:'Vampiric',        desc:'Heal 15% of damage dealt.' },
  { id:'shock',    name:'Static Discharge',desc:'15% chance to stun the target for a turn.' },
  { id:'shred',    name:'Armor Shred',     desc:'Each hit permanently lowers enemy defense by 1.' },
  { id:'fragment', name:'Fragmentation',   desc:'Weapon fires one additional hit.' },
];
function mutationPool(){ return ALL_MUTATIONS.filter(m=>META.unlocks.mutations.includes(m.id)); }

function rollWeapon(baseId, forceTier){
  const base = WEAPON_BASE[baseId];
  const pre = forceTier!=null ? PREFIX[forceTier] : pick(PREFIX);
  const suf = pick(SUFFIX);
  const dmg = [Math.round(base.dmg[0]*pre.mult), Math.round(base.dmg[1]*pre.mult)];
  const tier = PREFIX.indexOf(pre);
  let mutation = null;
  const pool = mutationPool();
  const mutChance = 0.10 + tier*0.06; // higher tier = more likely to roll a mutation
  if(pool.length && Math.random() < mutChance) mutation = pick(pool);
  return {
    baseId, name: `${pre.n} ${base.name}${suf.n?' '+suf.n:''}${mutation?` ⟨${mutation.name}⟩`:''}`,
    dmg, crit: +(base.crit + suf.crit).toFixed(2),
    hits: base.hits||1, tag: base.tag, tech: !!base.tech,
    humMod: pre.hum, tier, mutation
  };
}

let S = { run:null };

function newPlayer(cls){
  const w = rollWeapon(cls.weapon, 2);
  const m = META.mastery[cls.id] || {kills:0, wins:0};
  const p = {
    cls: cls.id, className: cls.name,
    hp: cls.hp, maxHp: cls.hp,
    def: cls.def, tech: cls.tech, cool: cls.cool,
    humanity: cls.humanity, maxHumanity: cls.humanity,
    eddies: 20 + (META.purchased.includes('perk_eddies') ? 25 : 0),
    dmgRange: cls.dmg, ability: {...cls.ability, ready:true, cdLeft:0},
    weapon: w, inventory:[w],
    cyberware: [], relics:[],
    critBonus:0, dmgBonus:0, dodge:0, cdrBonus:0, regen:0, shopDiscount:0,
    items: { stims: META.purchased.includes('perk_stim') ? 2 : 1 },
    usedSecondWind:false,
  };
  if(p.cls==='fixer') p._extraReroll = (p._extraReroll||0) + 1;
  // meta-shop permanent perks
  ['perk_maxhp_1','perk_maxhp_2','perk_maxhp_3'].forEach(id=>{ if(META.purchased.includes(id)){ p.maxHp+=3; p.hp+=3; } });
  // specialized class mastery bonuses
  applyMasteryBonuses(p, cls.id, m);
  p.mastered = p.masteryLevel >= 6;
  return p;
}
function addToInventory(P, w){ P.inventory.push(w); if(P.inventory.length>6) P.inventory.shift(); }

function installCyberware(P, cw, risky){
  P.cyberware.push(cw);
  cw.apply(P);
  const humLoss = risky ? cw.hum + rnd(2,6) : cw.hum;
  P.humanity = clamp(P.humanity - humLoss, 0, P.maxHumanity);
  print(`<span class="tag loot">CHROME</span> Installed <b>${cw.name}</b> (${cw.slot}) — ${cw.desc}. <span class="warn">-${humLoss} Humanity</span>.`);
  checkCyberpsychosis(P);
}
function checkCyberpsychosis(P){
  if(P.humanity <= P.maxHumanity*0.25 && !P.cyberpsychosisWarned){
    P.cyberpsychosisWarned = true;
    print(`<span class="tag boss">WARNING</span> <span class="bad">Humanity critical. The line between you and your chrome is getting thin. Combat rolls now have a chance to go berserk.</span>`);
  }
}
function grantRelic(P, relic){
  const before = new Set(getActiveRelicSynergies(P).map(s=>s.id));
  P.relics.push(relic);
  if(relic.apply) relic.apply(P);
  print(`<span class="tag relic">RELIC</span> Acquired <b class="purp">${relic.name}</b> — ${relic.desc}`);
  getActiveRelicSynergies(P)
    .filter(s=>!before.has(s.id))
    .forEach(s=>print(`<span class="tag relic">SYNERGY</span> <b class="purp">${s.name}</b> online — ${s.desc}`));
}

const ACTS = [
  { name:'Watson',          len:7 },
  { name:'Pacifica',        len:8 },
  { name:'Blackwall Relay', len:1, midboss:true },
  { name:'Corpo Plaza',     len:9 },
  { name:'Arasaka Tower',   len:1, boss:true },
];

async function startRun(cls, hardMode){
  window.CyberdoomBot?.beginRun();
  META.runsStarted++; saveMeta();
  const player = newPlayer(cls);
  S.run = { player, act:0, node:0, actName:ACTS[0].name, actLen:ACTS[0].len, heat:0,
            kills:0, eliteKills:0, actBuffs:[], actEddiesMult:1, actContactDone:false,
            eventHistory:[], starting:true, hardMode: !!hardMode };
  setStatus(true); refreshStatus();
  log.innerHTML='';
  print(`<span class="tag">JACK IN</span> Character created: <b class="accent">${player.className}</b>${player.mastered?' <span class="purp">[MASTERED]</span>':''}. Starting loadout: <b>${player.weapon.name}</b>.${hardMode?' <span class="bad">OVERWATCH MODE — enemies hit harder, rewards are bigger.</span>':''}`, 'sys');
  print(`<span class="flavor">The rain over Night City never really stops. Neither does the work.</span>`);
  divider();
  runStartChoice();
}

function runStartChoice(){
  const P = S.run.player;
  S.run.starting = true;
  refreshStatus();

  print(`<span class="tag relic">LOADOUT CACHE</span> Before you disappear into Watson, one last dead-drop waits under a flickering holo-ad. Take one edge into the run.`, 'sys');

  const choices = [...relicPool()]
    .filter(r=>!hasRelic(P,r.id))
    .sort(()=>Math.random()-0.5)
    .slice(0,3);

  const opts = choices.map(r=>({
    bot:{kind:'relic', relic:r},
    label:`Take ${r.name}`,
    sub:r.desc,
    cls:'purp',
    fn:()=>{
      grantRelic(P,r);
      S.run.starting=false;
      refreshStatus();
      divider();
      nextNode();
    }
  }));

  opts.push({
    label:'Take the eddies',
    sub:'+60 eddies instead of a relic',
    cls:'gold',
    fn:()=>{
      P.eddies += 60;
      print(`<span class="tag loot">STARTING CAPITAL</span> <span class="good">+60 eddies.</span>`);
      S.run.starting=false;
      refreshStatus();
      divider();
      nextNode();
    }
  });

  actions(opts);
}

function nextNode(){
  const run = S.run;
  let act = ACTS[run.act];
  refreshStatus();

  if(run.node >= act.len){
    revertActBuffs();
    run.act++;
    if(run.act >= ACTS.length){ return victory(); }
    run.node = 0;
    run.actContactDone = false;
    run.actEddiesMult = 1;
    act = ACTS[run.act];
    run.actName = act.name;
    run.actLen = act.len;
    print(`<span class="tag">DISTRICT</span> Entering <b class="accent">${run.actName}</b>...`, 'sys');
    divider();
    refreshStatus();
  }

  if(act.midboss) return midBossEncounter();
  if(act.boss) return bossEncounter();

  const contactNode = Math.max(2, Math.floor(act.len*0.35));
  if(!run.actContactDone && run.node===contactNode && act.len>3){
    run.actContactDone = true;
    return runContact();
  }

  let type;
  if(run.node === act.len-1){
    type='elite';
  }
  else{
    const roll = Math.random();
    if(roll<0.38) type='combat';
    else if(roll<0.58) type='event';
    else if(roll<0.72) type='shop';
    else if(roll<0.84) type='rest';
    else type='relic';
  }

  if(type==='combat') return startCombat(pick(ENEMY_POOL.street), false);
  if(type==='elite') return startCombat(pick(ENEMY_POOL.elite), true);
  if(type==='event') return runEvent();
  if(type==='shop') return runShop();
  if(type==='rest') return runRest();
  if(type==='relic') return runRelicCache();
}
function advance(){ S.run.node++; refreshStatus(); nextNode(); }

function revertActBuffs(){
  const P = S.run.player;
  S.run.actBuffs.forEach(b=>{
    if(b.stat==='eddiesMult'){ S.run.actEddiesMult = 1; }
    else P[b.stat] -= b.amount;
  });
  S.run.actBuffs = [];
}

// ---------- fixer contact (boon choice) ----------
function runContact(){
  const P = S.run.player;
  print(`<span class="tag hack">FIXER CONTACT</span> A familiar face waits in the shadow of a noodle stand. "Got a couple favors I can call in for you. Pick one — the rest walk away."`, 'sys');
  const opts = [...BOONS].sort(()=>Math.random()-0.5).slice(0,3);
  actions(opts.map(b=>({
    label: b.label, sub: b.sub, cls:'purp', fn:()=>{
      if(b.stat==='eddiesMult') S.run.actEddiesMult = 1+b.amount;
      else P[b.stat] += b.amount;
      S.run.actBuffs.push(b);
      print(`Favor called in: <b class="purp">${b.label}</b>.`);
      refreshStatus(); divider(); advance();
    }
  })));
}

function runRelicCache(){
  const P = S.run.player;
  print(`<span class="tag relic">BLACK MARKET CACHE</span> A hidden stash, tucked behind a vending unit. Something valuable glints inside.`, 'sys');
  const avail = relicPool().filter(r=>!hasRelic(P,r.id));
  if(!avail.length){ print('Nothing here you don\'t already have.', 'flavor'); divider(); return advance(); }
  const opts = avail.sort(()=>Math.random()-0.5).slice(0,3);
  const list = opts.map(r=>({ bot:{kind:'relic', relic:r}, label:r.name, sub:r.desc, cls:'purp', fn:()=>{ grantRelic(P,r); divider(); advance(); } }));
  list.push({ label:'Leave it', fn:()=>{ divider(); advance(); } });
  actions(list);
}

// ---------- events ----------
function runEvent(){
  const P = S.run.player;
  const run = S.run;
  run.eventHistory = run.eventHistory || [];

  const eligible = EVENTS.filter(ev=>
    (ev.minAct==null || run.act>=ev.minAct) &&
    (ev.maxAct==null || run.act<=ev.maxAct)
  );
  const recent = new Set(run.eventHistory.slice(-3));
  const fresh = eligible.filter(ev=>!recent.has(ev.id));
  const ev = pick(fresh.length ? fresh : eligible);

  run.eventHistory.push(ev.id);
  run.eventHistory = run.eventHistory.slice(-5);

  print(`<span class="tag">MYSTERY SIGNAL</span> ${ev.text}`, 'sys');

  const opts = ev.opts
    .filter(o=>!o.show || o.show(P,run))
    .map(o=>{
      const disabled = typeof o.disabled==='function' ? o.disabled(P,run) : !!o.disabled;
      const label = typeof o.label==='function' ? o.label(P,run) : o.label;
      const sub = typeof o.sub==='function' ? o.sub(P,run) : o.sub;
      return {
        label, sub, cls:o.cls, disabled,
        fn:()=>{
          const result = o.fn ? o.fn(P,run) : null;
          refreshStatus();
          checkCyberpsychosis(P);
          if(P.hp<=0 && checkDeath()) return;
          if(result && result.advance===false) return;
          divider();
          advance();
        }
      };
    });

  actions(opts);
}

// ---------- shop ----------
function runShop(){
  const P = S.run.player;
  print(`<span class="tag loot">RIPPERDOC</span> "Got chrome, got iron. Eddies talk." <span class="flavor">(You have ${P.eddies} eddies.)</span>`, 'sys');
  const disc = 1-(P.shopDiscount||0);
  const stock = [];
  stock.push({ kind:'weapon', item: rollWeapon(pick(Object.keys(WEAPON_BASE))), price: Math.round(rnd(35,70)*disc) });
  stock.push({ kind:'weapon', item: rollWeapon(pick(Object.keys(WEAPON_BASE))), price: Math.round(rnd(35,70)*disc) });
  const cwChoices = cyberwarePool().filter(c=>!P.cyberware.includes(c));
  stock.push({ kind:'cyber', item: pick(cwChoices.length?cwChoices:cyberwarePool()), price: Math.round(rnd(50,90)*disc) });
  stock.push({ kind:'stim', item:{name:'Combat Stim (+heal mid-fight)'}, price: Math.round(25*disc) });

  let rerollsLeft = 1 + (P._extraReroll||0);

  function render(){
    const opts = stock.map((s,i)=>{
      let label, sub;
      if(s.kind==='weapon'){ label=`Buy: ${s.item.name}`; sub=`${s.item.dmg[0]}-${s.item.dmg[1]} dmg, crit ${Math.round(s.item.crit*100)}% — ${s.price}e`; }
      else if(s.kind==='cyber'){ label=`Install: ${s.item.name}`; sub=`${s.item.desc} (${s.item.slot}) — ${s.price}e, -${s.item.hum} Humanity`; }
      else { label=`Buy: ${s.item.name}`; sub=`${s.price}e`; }
      return { label, sub, bot:{kind:'shop', itemKind:s.kind, item:s.item, price:s.price}, cls:'gold', disabled: P.eddies<s.price, fn:()=>{
          P.eddies -= s.price;
          if(s.kind==='weapon'){ addToInventory(P,s.item); print(`Bought <b>${s.item.name}</b>.`,'good'); }
          else if(s.kind==='cyber'){ installCyberware(P, s.item, false); }
          else { P.items.stims++; print('Bought a combat stim.', 'good'); }
          refreshStatus();
          stock.splice(i,1);
          render();
      }};
    });
    if(rerollsLeft>0){
      opts.push({ label:`Reroll stock (${rerollsLeft} left)`, cls:'purp', fn:()=>{
          rerollsLeft--;
          stock.forEach((s,i)=>{
            if(s.kind==='weapon') stock[i]={kind:'weapon', item:rollWeapon(pick(Object.keys(WEAPON_BASE))), price:Math.round(rnd(35,70)*disc)};
          });
          render();
      }});
    }
    opts.push({ label:'Leave the clinic', cls:'', fn:()=>{ divider(); advance(); } });
    actions(opts);
  }
  render();
}

// ================= COMBAT =================
function scaledEnemy(base, act, elite, hardMode){
  // Blackwall Relay sits at act index 2, but it should not inflate Corpo's normal scaling tier.
  const tier = act >= 3 ? act-1 : act;
  let hpScale = 1 + tier*0.35;
  let dmgScale = 1 + tier*0.35;

  // Watson is the learning district: reduce burst damage and soften its forced elite.
  if(act===0){
    dmgScale *= 0.85;
    if(elite || base.elite) hpScale *= 0.90;
  }

  if(hardMode){
    hpScale *= 1.2;
    dmgScale *= 1.2;
  }

  return {
    name: base.name,
    maxHp: Math.round(base.hp*hpScale),
    hp: Math.round(base.hp*hpScale),
    dmg: [Math.round(base.dmg[0]*dmgScale), Math.round(base.dmg[1]*dmgScale)],
    def: base.def + Math.floor(tier*0.7),
    tech: !!base.tech,
    elite: !!elite || !!base.elite,
    berserk: !!base.berserk
  };
}

function startCombat(baseEnemy, elite){
  const run = S.run;
  const enemy = scaledEnemy(baseEnemy, run.act, elite, run.hardMode);
  run.combat = { enemy, playerStunned:false, enemyBleed:0, firstHitUsed:false };
  print(`<span class="tag combat">${elite?'ELITE ':''}CONTACT</span> <b class="${elite?'bad':''}">${enemy.name}</b> ${elite?'blocks your path.':'steps out of the shadows.'} <span class="flavor">HP ${enemy.hp}</span>`, 'sys');
  refreshStatus();
  combatMenu();
}

function getEvadeChance(P){
  return Math.min(
    0.95,
    0.65 +
    ((P.cool||0) * 0.015) +
    (hasRelic(P,'ghost_runner') ? 0.15 : 0) +
    (hasRelic(P,'combat_predictor') ? 0.08 : 0)
  );
}

function combatMenu(){
  const P = S.run.player;
  const c = S.run.combat;
  if(!c) return;
  const ab = P.ability;
  const affinity = getClassWeaponAffinity(P);
  actions([
    { label:'Attack', sub:`${P.weapon.name}${affinity?' • AFFINITY':''}`, fn:()=>playerAttack(false) },
    { label: ab.cdLeft>0 ? `${ab.name} (cd ${ab.cdLeft})` : ab.name, sub: ab.desc, disabled: ab.cdLeft>0, cls:'gold', fn:()=>playerAttack(true) },
    { label:'Use Stim', sub:`Heal ${hasRelic(P,'medtech_patch') ? '35' : '25'}% HP${hasRelicSynergy(P,'trauma_rig')?' + 5 Humanity':''} (${P.items.stims} left)`, disabled: P.items.stims<=0, fn:()=>useStim() },
    { label:'Switch Weapon', sub: P.inventory.length>1 ? 'Choose from inventory' : 'No other weapons', disabled: P.inventory.length<=1, fn:()=>switchWeaponMenu() },
    { label:'Guard', sub:`Reduce the next incoming hit by ${hasRelicSynergy(P,'fortress_stack') ? '75' : hasRelic(P,'guardian_daemon') ? '65' : '50'}%`, cls:'gold', fn:()=>guardAction() },
    { label:'Evade', sub:`${Math.round(getEvadeChance(P)*100)}% chance to avoid the next attack`, fn:()=>evadeAction() },
  ]);
}

function switchWeaponMenu(){
  const P = S.run.player;
  const opts = P.inventory.map((w,i)=>({
    bot:{kind:'equip', weapon:w},
    label:(w===P.weapon?'[Equipped] ':'')+w.name,
    sub:`${w.dmg[0]}-${w.dmg[1]} dmg, crit ${Math.round(w.crit*100)}%${w.mutation?' ⟨'+w.mutation.name+'⟩':''}`,
    fn:()=>{ P.weapon=w; print(`Switched to <b>${w.name}</b>.`); combatMenu(); }
  }));

  if(P.inventory.length>1){
    opts.push({
      label:'Drop Weapon',
      sub:'Discard a weapon from your inventory',
      cls:'danger',
      fn:()=>dropWeaponMenu()
    });
  }

  opts.push({label:'Back', fn:()=>combatMenu()});
  actions(opts);
}

function dropWeaponMenu(){
  const P = S.run.player;

  if(P.inventory.length<=1){
    print('You cannot drop your last weapon.', 'warn');
    return combatMenu();
  }

  const opts = P.inventory.map((w,i)=>({
    label:`Drop ${w.name}`,
    sub:w===P.weapon ? 'Currently equipped — another weapon will auto-equip' : 'Discard permanently for this run',
    cls:'danger',
    fn:()=>{
      dropWeapon(i);
      combatMenu();
    }
  }));

  opts.push({label:'Back', fn:()=>switchWeaponMenu()});
  actions(opts);
}

function useStim(){
  const P = S.run.player;
  P.items.stims--;
  const healPct = hasRelic(P,'medtech_patch') ? 0.35 : 0.25;
  const heal = Math.round(P.maxHp*healPct);
  P.hp = clamp(P.hp+heal, 0, P.maxHp);
  let extra = '';
  if(hasRelicSynergy(P,'trauma_rig')){
    const hum = Math.min(5,P.maxHumanity-P.humanity);
    P.humanity = clamp(P.humanity+5,0,P.maxHumanity);
    extra = ` <span class="purp">Trauma Rig: +${hum} Humanity.</span>`;
  }
  print(`<span class="tag hack">STIM</span> <span class="good">+${heal} HP.</span>${extra}`);
  refreshStatus();
  enemyTurn();
}

function guardAction(){
  const P = S.run.player;
  const c = S.run.combat;
  if(!c) return;

  const guardPct = hasRelicSynergy(P,'fortress_stack') ? 75 : hasRelic(P,'guardian_daemon') ? 65 : 50;
  c.guarding = true;
  c.evading = false;
  c.guardReduction = guardPct/100;

  print(
    `<span class="tag hack">GUARD</span> You brace for impact. ` +
    `<span class="good">The next incoming hit will be reduced by ${guardPct}%.</span>`
  );

  enemyTurn();
}

function evadeAction(){
  const P = S.run.player;
  const c = S.run.combat;
  if(!c) return;

  c.evading = true;
  c.guarding = false;
  c.evadeChance = getEvadeChance(P);

  print(
    `<span class="tag hack">EVADE</span> You shift your stance and prepare to move. ` +
    `<span class="accent">${Math.round(c.evadeChance*100)}% chance to avoid the next attack.</span>`
  );

  enemyTurn();
}

function applyHitEffects(P, c, dmgDealt, isCrit){
  const mut = P.weapon.mutation;
  let extra = '';
  if(mut){
    if(mut.id==='bleed'){ const b=Math.round(dmgDealt*0.2); c.enemyBleed=(c.enemyBleed||0)+b; }
    if(mut.id==='vampiric'){ const h=Math.round(dmgDealt*0.15); P.hp=clamp(P.hp+h,0,P.maxHp); extra+=` <span class="good">+${h} HP leeched.</span>`; }
    if(mut.id==='shock' && Math.random()<0.15){ c.enemyStunned=true; extra+=' <span class="warn">Target stunned!</span>'; }
    if(mut.id==='shred'){ c.enemy.def=Math.max(0,c.enemy.def-1); }
  }
  if(isCrit && hasRelic(P,'bloodwire')){
    const heal = hasRelicSynergy(P,'redline_loop') ? 3 : 2;
    P.hp=clamp(P.hp+heal,0,P.maxHp);
    extra+=` <span class="good">+${heal} HP (${hasRelicSynergy(P,'redline_loop')?'Redline Loop':'Bloodwire'}).</span>`;
  }
  return extra;
}

function playerAttack(useAbility){
  const P = S.run.player;
  const c = S.run.combat;
  const berserkMode = P.humanity <= P.maxHumanity*0.25 && Math.random()<0.3;

  const affinity = getClassWeaponAffinity(P);
  let hits = (P.weapon.hits || 1) + (P.weapon.mutation && P.weapon.mutation.id==='fragment' ? 1 : 0);
  let totalDmg = 0, anyCrit=false, effectsHtml='';

  if(useAbility){
    const ab = P.ability;
    ab.cdLeft = Math.max(0, ab.cd - Math.max(0,P.cdrBonus));
    ab.ready = false;
    const abilityId = ab.id || '';

    if(abilityId==='netrunner_quickhack'){
      const targetScale = Math.max(1, Math.round(c.enemy.maxHp*0.08));
      let d = rnd(6,11) + P.tech + P.dmgBonus + targetScale;
      totalDmg = d;
      const stunChance = Math.min(0.50, 0.25 + P.tech*0.02);
      const stunned = Math.random() < stunChance;
      c.enemy.def = Math.max(0, c.enemy.def-1);
      print(`<span class="tag hack">QUICKHACK</span> You breach ${c.enemy.name}'s ICE for <b>${totalDmg}</b> tech damage (armor ignored). <span class="accent">Armor -1.</span>${stunned?' <span class="warn">Target stunned — skips next attack.</span>':''}`);
      c.enemy.hp -= totalDmg;
      c.enemyStunned = stunned;
    }
    else if(abilityId==='netrunner_daemon'){
      const targetScale = Math.max(1, Math.round(c.enemy.maxHp*0.05));
      const d = rnd(3,6) + P.tech + P.dmgBonus + targetScale;
      const bleed = Math.max(2, Math.round(P.tech*0.7));
      const stunned = Math.random() < 0.70;
      c.enemy.hp -= d;
      c.enemyBleed = (c.enemyBleed||0) + bleed;
      c.enemyStunned = stunned;
      totalDmg = d;
      print(`<span class="tag hack">DAEMON CASCADE</span> Malicious code tears through the target for <b>${d}</b> tech damage. <span class="warn">BLEED ${bleed}</span>${stunned?' <span class="accent">Target stunned.</span>':''}`);
    }
    else if(abilityId==='chrome_berserk'){
      const missing = 1-(P.hp/P.maxHp);
      let d = rnd(...P.dmgRange) + Math.round(missing*10) + P.dmgBonus - c.enemy.def;
      d = Math.max(1,d);
      const humCost = Math.max(1,3-(P._chromeAbilityDiscount||0));
      P.humanity = clamp(P.humanity-humCost,0,P.maxHumanity);
      print(`<span class="tag crit">BERSERK</span> Rage fuels the chrome. <b>${d}</b> damage. <span class="warn">-${humCost} Humanity.</span>`);
      c.enemy.hp -= d; totalDmg=d;
      checkCyberpsychosis(P);
    }
    else if(abilityId==='chrome_groundpound'){
      const missing = 1-(P.hp/P.maxHp);
      let d = rnd(...P.weapon.dmg) + P.dmgBonus + P.def + Math.round(missing*6) - c.enemy.def;
      d = Math.max(1,d);
      const humCost = Math.max(1,5-(P._chromeAbilityDiscount||0));
      const stunned = Math.random()<0.40;
      P.humanity = clamp(P.humanity-humCost,0,P.maxHumanity);
      c.enemy.hp -= d;
      c.enemyStunned = stunned;
      totalDmg=d;
      print(`<span class="tag crit">GROUND POUND</span> Chrome hits pavement and target alike for <b>${d}</b> damage. <span class="warn">-${humCost} Humanity.</span>${stunned?' <span class="accent">Target stunned.</span>':''}`);
      checkCyberpsychosis(P);
    }
    else if(abilityId==='samurai_blade_dance'){
      let d = rnd(...P.dmgRange) + P.dmgBonus - c.enemy.def;
      d=Math.max(1,d)*2;
      const followMult = 0.6 + (P._samuraiMastery?0.20:0);
      print(`<span class="tag crit">BLADE DANCE</span> Guaranteed critical — <b>${d}</b> damage, then a follow-up strike!`);
      c.enemy.hp -= d;
      let d2 = Math.max(1, Math.round((rnd(...P.dmgRange)+P.dmgBonus-c.enemy.def)*followMult));
      c.enemy.hp -= d2;
      print(`Follow-up strike: <b>${d2}</b> more damage.`);
      totalDmg = d+d2;
    }
    else if(abilityId==='samurai_iaijutsu'){
      const mult = P._samuraiMastery ? 3.4 : 3.0;
      let d = Math.round((rnd(...P.weapon.dmg)+P.dmgBonus)*mult) - Math.floor(c.enemy.def*0.5);
      d = Math.max(1,d);
      c.enemy.hp -= d;
      totalDmg=d;
      anyCrit=true;
      effectsHtml += applyHitEffects(P,c,d,true);
      print(`<span class="tag crit">IAIJUTSU</span> One draw. One cut. <b>${d}</b> damage through half armor. <span class="warn">CRITICAL!</span>${effectsHtml}`);
    }
    else if(abilityId==='rocker_rally'){
      P.dmgBonus += 2;
      P.def += 1;
      P.cool += 2;
      c.rallyTurns = 3 + (P._rockerEncore||0);
      print(`<span class="tag hack">RALLY CRY</span> Adrenaline and distortion pedals. <span class="good">+2 dmg, +1 def, +2 cool for ${c.rallyTurns} turns.</span>`);
    }
    else if(abilityId==='rocker_feedback'){
      const suppress = 2 + (P._rockerEncore||0);
      let d = rnd(4,7) + P.cool + P.dmgBonus + (P._rockerEncore?2:0) - Math.floor(c.enemy.def*0.5);
      d = Math.max(1,d);
      c.enemy.hp -= d;
      c.enemy.dmg = [Math.max(1,c.enemy.dmg[0]-suppress), Math.max(1,c.enemy.dmg[1]-suppress)];
      totalDmg=d;
      print(`<span class="tag hack">FEEDBACK BURST</span> Sonic overload hits for <b>${d}</b> damage. <span class="good">Enemy damage -${suppress} for this fight.</span>`);
    }
    else if(abilityId==='nomad_scavenger'){
      c.guaranteedLoot = true;
      if(P._nomadSalvage) c.contractBonus = Math.max(c.contractBonus||0,P._nomadSalvage);
      print(`<span class="tag hack">SCAVENGER INSTINCT</span> You mark this kill for salvage. Guaranteed bonus loot after the fight.${P._nomadSalvage?' <span class="good"> +20% eddies on kill.</span>':''}`);
    }
    else if(abilityId==='nomad_roadwarrior'){
      let d = Math.round((rnd(...P.weapon.dmg)+P.dmgBonus+P.def)*1.3) - c.enemy.def;
      d = Math.max(1,d);
      c.enemy.hp -= d;
      c.guarding = true;
      c.guardReduction = 0.35;
      if(P._nomadSalvage) c.contractBonus = Math.max(c.contractBonus||0,P._nomadSalvage);
      totalDmg=d;
      print(`<span class="tag hack">ROAD WARRIOR</span> You crash through the line for <b>${d}</b> damage, then brace. <span class="good">35% Guard on the counterattack.</span>${P._nomadSalvage?' <span class="good"> Kill marked +20% eddies.</span>':''}`);
    }
    else if(abilityId==='fixer_connections'){
      let d = rnd(5,8) + P.tech + P.cool + P.dmgBonus;
      d = Math.max(1,d);
      c.enemy.hp -= d;
      totalDmg = d;
      const mark = 0.25 + (P._fixerContractBonus||0);
      c.contractBonus = Math.max(c.contractBonus||0, mark);
      print(`<span class="tag hack">CONNECTIONS</span> A contact paints the target from off-grid. <b>${d}</b> armor-piercing damage. <span class="good">Target marked: +${Math.round(mark*100)}% eddies on kill.</span>`);
    }
    else if(abilityId==='fixer_professional'){
      let d = rnd(4,6) + P.tech + P.cool + P.dmgBonus;
      d = Math.max(1,d);
      c.enemy.hp -= d;
      c.enemy.def = Math.max(0,c.enemy.def-2);
      const mark = 0.15 + (P._fixerContractBonus||0);
      c.contractBonus = Math.max(c.contractBonus||0,mark);
      totalDmg=d;
      print(`<span class="tag hack">PROFESSIONAL COURTESY</span> A clean off-book hit deals <b>${d}</b> armor-piercing damage. <span class="accent">Armor -2.</span> <span class="good">+${Math.round(mark*100)}% eddies on kill.</span>`);
    }
    else if(abilityId==='solo_killshot'){
      const affinity = getClassWeaponAffinity(P);
      let base = rnd(...P.weapon.dmg) + P.dmgBonus + (P.weapon.tech?P.tech:0);
      if(P._ballisticMastery && P.weapon.tag==='ballistic') base += P._ballisticMastery;
      if(affinity){
        base += (affinity.techBonus||0) + (affinity.flatDamage||0);
        if(affinity.damageMult) base = Math.round(base*affinity.damageMult);
      }
      const d = Math.max(1,Math.round(base*2.2));
      c.enemy.hp -= d;
      totalDmg=d;
      anyCrit=true;
      effectsHtml += applyHitEffects(P,c,d,true);
      print(`<span class="tag crit">KILLSHOT</span> One perfect line through the target. <b>${d}</b> damage, armor ignored. <span class="warn">CRITICAL!</span>${effectsHtml}`);
    }
    else {
      let d = Math.round((rnd(...P.dmgRange)+P.dmgBonus)*1.6) - Math.max(0,c.enemy.def-2);
      d = Math.max(1,d);
      print(`<span class="tag crit">OVERWATCH</span> Combat reflexes kick in. <b>${d}</b> damage, armor mostly bypassed.`);
      c.enemy.hp -= d; totalDmg=d;
    }
  } else {
    const armorPerHit = hits>1 ? Math.ceil(c.enemy.def / hits) : c.enemy.def;
    for(let i=0;i<hits;i++){
      let base = rnd(...P.weapon.dmg) + P.dmgBonus + (P.weapon.tech?P.tech:0);
      if(P._ballisticMastery && P.weapon.tag==='ballistic') base += P._ballisticMastery;
      if(affinity){
        base += (affinity.techBonus||0) + (affinity.flatDamage||0);
        if(affinity.damageMult) base = Math.round(base * affinity.damageMult);
      }
      if(hasRelic(P,'adrenal_plug') && P.hp < P.maxHp*0.3) base += 3;
      let critChance = P.weapon.crit + P.critBonus + (affinity?.critBonus||0) + (berserkMode?0.25:0);
      let crit = Math.random() < critChance;
      let openingExecution = false;
      if(i===0 && !c.firstHitUsed && hasRelic(P,"widows_kiss")){
        crit=true;
        c.firstHitUsed=true;
        openingExecution = hasRelicSynergy(P,'execution_protocol');
      }
      let d = crit ? Math.round(base*1.8) : base;
      const armorThisHit = openingExecution ? Math.max(0,armorPerHit-2) : armorPerHit;
      d = Math.max(1, d - armorThisHit);
      c.enemy.hp -= d; totalDmg += d; anyCrit = anyCrit||crit;
      effectsHtml += applyHitEffects(P, c, d, crit);
      if(openingExecution) effectsHtml += ' <span class="purp">EXECUTION PROTOCOL: -2 armor.</span>';
    }
    print(`<span class="tag${anyCrit?' crit':''}">HIT</span> ${P.weapon.name} deals <b>${totalDmg}</b> damage${hits>1?` across ${hits} shots`:''}.${affinity?' <span class="accent">CLASS AFFINITY</span>':''}${anyCrit?' <span class="warn">CRITICAL!</span>':''}${berserkMode?' <span class="bad">(chrome-fueled rage)</span>':''}${effectsHtml}`);
  }

  refreshStatus();
  if(c.enemy.hp <= 0) return winCombat();
  enemyTurn();
}

function enemyTurn(){
  const P = S.run.player; const c = S.run.combat;
  if(!c) return;

  if(c.enemyBleed>0){
    c.enemy.hp -= c.enemyBleed;
    print(`<span class="tag">BLEED</span> ${c.enemy.name} takes <b>${c.enemyBleed}</b> bleed damage.`);
    c.enemyBleed = 0;
    refreshStatus();
    if(c.enemy.hp<=0) return winCombat();
  }

  if(c.enemyStunned){
    print(`<b>${c.enemy.name}</b> is stunned and skips its turn.`);
    c.enemyStunned=false;
  }
  else{
    let d = rnd(...c.enemy.dmg) - Math.floor(P.def);

    if(c.enemy.berserk && c.enemy.hp < c.enemy.maxHp*0.4){
      d = Math.round(d*1.5);
    }

    let avoided = false;

    if(c.evading){
      const evadeChance = c.evadeChance || 0.65;

      if(Math.random() < evadeChance){
        print(
          `<span class="tag hack">EVADE</span> You slip past ` +
          `<b>${c.enemy.name}</b>'s attack completely.`,
          'good'
        );
        d = 0;
        avoided = true;
        if(hasRelicSynergy(P,'ghost_protocol') && P.ability.cdLeft>0){
          P.ability.cdLeft = Math.max(0,P.ability.cdLeft-1);
          print('<span class="tag relic">GHOST PROTOCOL</span> Successful Evade cuts your special cooldown by 1.');
        }
      } else {
        print(
          `<span class="tag combat">EVADE FAILED</span> ` +
          `<b>${c.enemy.name}</b> tracks your movement.`
        );
      }

      c.evading = false;
      c.evadeChance = 0;
    }

    if(!avoided && Math.random() < P.dodge){
      print(`You dodge <b>${c.enemy.name}</b>'s attack completely.`,'good');
      d = 0;
      avoided = true;
    }

    if(c.guarding && d > 0){
      const original = Math.max(0,d);
      const reduction = c.guardReduction || 0.50;
      d = Math.ceil(original * (1-reduction));

      print(
        `<span class="tag hack">GUARD</span> You absorb the hit. ` +
        `<span class="good">${original} → ${d} damage.</span>`
      );
    }

    c.guarding = false;
    c.guardReduction = 0;
    d = Math.max(0,d);

    if(d>0){
      P.hp = clamp(P.hp-d,0,P.maxHp);
      print(`<b>${c.enemy.name}</b> hits you for <span class="bad">${d}</span>.`);
    }
  }
  if(P.regen>0) P.hp = clamp(P.hp+P.regen, 0, P.maxHp);
  if(c.rallyTurns){ c.rallyTurns--; if(c.rallyTurns<=0){ P.dmgBonus-=2; P.def-=1; P.cool-=2; c.rallyTurns=null; print('Rally Cry fades.', 'flavor'); } }
  if(P.ability.cdLeft>0) P.ability.cdLeft--;
  refreshStatus();
  if(checkDeath()) return;
  combatMenu();
}

function checkDeath(){
  const P = S.run.player;
  if(P.hp<=0){
    if(hasRelic(P,'second_wind') && !P.usedSecondWind){
      P.usedSecondWind = true;
      const reviveHp = hasRelicSynergy(P,'last_breath') ? Math.max(1,Math.round(P.maxHp*0.25)) : 1;
      P.hp = reviveHp;
      print(`<span class="tag relic">SECOND WIND</span> <span class="purp">Your relic flatlines instead of you — emergency systems kick your heart back on. ${reviveHp} HP.${hasRelicSynergy(P,'last_breath')?' LAST BREATH online.':''}</span>`);
      refreshStatus();
      return false;
    }
    print(`<span class="tag boss">FLATLINED</span> <span class="bad">The world goes dark. Your final signal cuts out somewhere in ${S.run.actName}.</span>`, 'sys');
    endRun(false);
    return true;
  }
  return false;
}

function winCombat(){
  const P = S.run.player; const c = S.run.combat;
  S.run.kills++;
  const rewardTier = S.run.act >= 3 ? S.run.act-1 : S.run.act;
  let eddies = rnd(10,25) + rewardTier*8 + (c.midboss ? 40 : 0);
  eddies = Math.round(
    eddies *
    (S.run.actEddiesMult||1) *
    (hasRelic(P,'loyalty_chip')?1.2:1) *
    (1 + (c.contractBonus||0))
  );
  P.eddies += eddies;
  print(`<span class="tag">DOWN</span> <b>${c.enemy.name}</b> flatlines. <span class="good">+${eddies} eddies.</span>`);

  if(c.enemy.elite){
    S.run.eliteKills++;
    const avail = relicPool().filter(r=>!hasRelic(P,r.id));
    if(avail.length){
      const opts3 = avail.sort(()=>Math.random()-0.5).slice(0,3);
      print(`<span class="tag relic">ELITE DROP</span> Choose a relic to take from the wreckage:`);
      const list = opts3.map(r=>({ bot:{kind:'relic', relic:r}, label:r.name, sub:r.desc, cls:'purp', fn:()=>{ grantRelic(P,r); divider(); actions([{label:'Move on', fn:()=>advance()}],{single:true}); } }));
      list.push({ label:'Skip — none of these', fn:()=>{ divider(); actions([{label:'Move on', fn:()=>advance()}],{single:true}); } });
      actions(list);
      refreshStatus();
      return;
    }
  }

  const scavengerContract = hasRelicSynergy(P,'scavenger_contract');
  const lootChance = 0.35 + (hasRelic(P,'scavenger_eye') ? 0.15 : 0) + (scavengerContract ? 0.10 : 0);
  if(c.guaranteedLoot || Math.random()<lootChance){
    if(scavengerContract){
      P.eddies += 10;
      print('<span class="tag relic">SCAVENGER CONTRACT</span> <span class="good">+10 eddies salvage fee.</span>');
    }
    if(Math.random()<0.5){
      const w = rollWeapon(pick(Object.keys(WEAPON_BASE)), c.enemy.elite?rnd(3,6):undefined);
      addToInventory(P,w);
      print(`<span class="tag loot">SALVAGE</span> Looted <b>${w.name}</b>.`);
    } else {
      const cwChoices = cyberwarePool().filter(x=>!P.cyberware.includes(x));
      if(cwChoices.length){
        const cw = pick(cwChoices);
        print(`<span class="tag loot">SALVAGE</span> Found cyberware: <b>${cw.name}</b>.`);
        actions([
          { label:`Install ${cw.name}`, sub:cw.desc+` (-${cw.hum} Humanity)`, cls:'gold', fn:()=>{ installCyberware(P,cw,false); divider(); advance(); } },
          { label:'Leave it — not worth the Humanity', fn:()=>{ divider(); advance(); } },
        ]);
        refreshStatus();
        return;
      }
    }
  }
  refreshStatus();
  divider();
  actions([{ label:'Move on', fn:()=>advance() }], {single:true});
}

function startBossFight(){

  const hardBonus = run.hardMode ? 1.2 : 1;
  const boss = {
    name:'Adam Smasher', maxHp: Math.round(150*heatBonus*hardBonus), hp: Math.round(150*heatBonus*hardBonus),

  };

const _origWinCombat = winCombat;
winCombat = function(){
  const c = S.run.combat;
  if(c.boss){
    if(c.enemy.phase===1 && c.enemy.hp <= c.enemy.maxHp*0.5 && c.enemy.hp>0){
      c.enemy.phase=2; c.enemy.dmg=[c.enemy.dmg[0]+3, c.enemy.dmg[1]+4];
      print(`<span class="tag boss">PHASE 2</span> Smasher's chassis vents smoke. "Now we're talking." <span class="bad">His attacks hit harder.</span>`);
      refreshStatus();
      return enemyTurn();
    }
    if(c.enemy.hp<=0){
      print(`<span class="tag boss">FLATLINE — CONFIRMED</span> <span class="good">Adam Smasher hits the floor. For one silent second, Night City feels almost survivable.</span>`);
      return endRun(true);
    }
    refreshStatus();
    return enemyTurn();
  }
  return _origWinCombat();
};

// ================= END OF RUN =================
function creditsForRun(run, won){
  const base = [8, 16, 26, 34, 46][run.act] || 8;
  let c = base + run.eliteKills*3 + (won ? 45 : 0);
  if(run.hardMode) c = Math.round(c*1.5);
  return c;
}

async function endRun(won){
  window.CyberdoomBot?.finishRun(won);
  setStatus(false);
  S.run.over=true;
  actionsEl.innerHTML='';
  const P = S.run.player;
  const run = S.run;

  META.bestDistrict = Math.max(META.bestDistrict, run.act+1);
  const earnedCredits = creditsForRun(run, won);
  META.credits += earnedCredits;
  if(!META.mastery[P.cls]) META.mastery[P.cls] = {kills:0, wins:0};
  const masteryBefore = getMasteryLevel(META.mastery[P.cls]);
  META.mastery[P.cls].kills += run.kills;
  if(won) { META.runsWon++; META.mastery[P.cls].wins += 1; }
  const masteryAfter = getMasteryLevel(META.mastery[P.cls]);
  META.log.unshift({ won, cls:P.className, district: won?'Arasaka Tower':run.actName, eddies:P.eddies, credits:earnedCredits, date:new Date().toISOString().slice(0,10) });
  META.log = META.log.slice(0,10);
  await saveMeta();

  divider();
  print(won
    ? `<span class="good">RUN COMPLETE. You walked out of Arasaka Tower. Not everyone does.</span>`
    : `<span class="bad">RUN OVER.</span> You reached <b>${run.actName}</b> as a <b>${P.className}</b>, banked ${P.eddies} eddies before the flatline.`
  );
  print(`<span class="purp">+${earnedCredits} credits</span> earned for the Fixer Network. <span class="flavor">Legend record: ${META.runsWon} wins / ${META.runsStarted} runs.</span>`);
  if(masteryAfter>masteryBefore){
    for(let lvl=masteryBefore+1; lvl<=masteryAfter; lvl++){
      const rank = MASTERY_RANKS.find(r=>r.level===lvl);
      const reward = MASTERY_PATHS[P.cls].rewards[lvl];
      print(`<span class="tag purp">MASTERY UP</span> <b>${P.className} Level ${lvl} — ${rank.name}</b><br><span class="purp">${reward.desc}</span>`);
    }
  }
  actions([
    { label:'New run', cls:'gold', fn:()=>showClassSelect() },
    { label:'Main menu', fn:()=>showTitle() },
  ]);
}
function victory(){ endRun(true); }

// ================= META SHOP =================
function buildShopCatalog(){
  const items = [];
  const lockedRelics = ALL_RELICS.filter(r=>!META.unlocks.relics.includes(r.id));
  lockedRelics.forEach((r,i)=> items.push({ id:'relic_'+r.id, kind:'relic', name:'Unlock Relic: '+r.name, desc:r.desc, cost:70+i*30 }));
  const lockedMut = ALL_MUTATIONS.filter(m=>!META.unlocks.mutations.includes(m.id));
  lockedMut.forEach((m,i)=> items.push({ id:'mut_'+m.id, kind:'mutation', name:'Unlock Mutation: '+m.name, desc:m.desc, cost:60+i*25 }));
  const lockedCw = CYBERWARE.filter(c=>!META.unlocks.cyberware.includes(c.id));
  lockedCw.forEach((c,i)=> items.push({ id:'cw_'+c.id, kind:'cyber', name:'Unlock Cyberware: '+c.name, desc:c.desc, cost:90+i*30 }));

  const perks = [
    { id:'perk_maxhp_1', name:'Combat Conditioning I', desc:'+3 max HP, all classes, permanently.', cost:100 },
    { id:'perk_maxhp_2', name:'Combat Conditioning II', desc:'+3 max HP, all classes, permanently.', cost:190, requires:'perk_maxhp_1' },
    { id:'perk_maxhp_3', name:'Combat Conditioning III', desc:'+3 max HP, all classes, permanently.', cost:280, requires:'perk_maxhp_2' },
    { id:'perk_stim', name:'Extra Stim Reserve', desc:'Start every run with 2 stims instead of 1.', cost:140 },
    { id:'perk_eddies', name:'Starting Capital', desc:'Start every run with +25 eddies.', cost:110 },
    { id:'perk_overwatch', name:'Unlock Overwatch Mode', desc:'New Game+ difficulty: tougher enemies, 1.5x credits & bigger payouts. Requires at least 1 win.', cost:260, requires:'win' },
  ];
  perks.forEach(p=>{
    if(META.purchased.includes(p.id)) return;
    if(p.requires==='win' && META.runsWon<1) return;
    if(p.requires && p.requires!=='win' && !META.purchased.includes(p.requires)) return;
    items.push({ id:p.id, kind:'perk', name:p.name, desc:p.desc, cost:p.cost });
  });
  return items;
}

function showMetaShop(){
  $('#app').classList.add('metaShopOpen');
  log.innerHTML='';
  print(`<span class="tag purp">FIXER NETWORK — BLACK MARKET</span> Spend Credits earned across runs on permanent unlocks. <span class="purp">You have ${META.credits} credits.</span>`, 'sys');
  render();
  function render(){
    const catalog = buildShopCatalog();
    if(!catalog.length){ print('Every contact you know has nothing left to sell you. You\'ve bought it all.', 'flavor'); }
    const opts = catalog.map(it=>({
      label: it.name, sub: `${it.desc} — ${it.cost}cr`, cls:'purp', disabled: META.credits<it.cost,
      fn: async ()=>{
        META.credits -= it.cost;
        if(it.kind==='relic') META.unlocks.relics.push(it.id.replace('relic_',''));
        if(it.kind==='mutation') META.unlocks.mutations.push(it.id.replace('mut_',''));
        if(it.kind==='cyber') META.unlocks.cyberware.push(it.id.replace('cw_',''));
        if(it.kind==='perk') META.purchased.push(it.id);
        await saveMeta();
        log.innerHTML='';
        print(`<span class="tag purp">FIXER NETWORK — BLACK MARKET</span> Spend Credits earned across runs on permanent unlocks. <span class="purp">You have ${META.credits} credits.</span>`, 'sys');
        print(`<span class="good">Purchased: ${it.name}.</span>`);
        render();
      }
    }));
    opts.push({ label:'Back to title', fn:()=>showTitle() });
    actions(opts);
  }
}

      <div class="stats">HP <b>${c.hp}</b> · DMG <b>${c.dmg[0]}-${c.dmg[1]}</b> · DEF <b>${c.def}</b> · TECH <b>${c.tech}</b> · COOL <b>${c.cool}</b> · HUMANITY <b>${c.humanity}</b><br>
      Weapon: <b>${WEAPON_BASE[c.weapon].name}</b> · Ability: <b>${c.ability.name}</b> — ${c.ability.desc}<br>
      Affinity: <b>${CLASS_WEAPON_AFFINITY[c.id].name}</b> — ${CLASS_WEAPON_AFFINITY[c.id].desc}<br>
      Mastery: <b>${level}/6 ${getMasteryRankName(level)}</b> · ${m.kills||0} kills / ${m.wins||0} wins${altUnlocked?`<br><span class="purp">Alternate special unlocked: ${ALT_ABILITIES[c.id].name}</span>`:''}</div>`;
    div.onclick = ()=>{
      const clone = JSON.parse(JSON.stringify(c));
      clone.hp += rnd(-3,3);
      clone.def += rnd(0,1);
      clone.cool += rnd(-1,1);
      if(altUnlocked) showAbilitySelect(clone,hardMode);
      else startRun(clone,hardMode);
    };
    wrap.appendChild(div);
  });
  log.appendChild(wrap);

  if(overwatchUnlocked){
    actions([
      { label: hardMode?'Turn Overwatch Mode OFF':'Turn Overwatch Mode ON', cls:hardMode?'':'danger', fn:()=>showClassSelect(!hardMode) },
      { label:'Back', fn:()=>showTitle() }
    ]);
  } else {
    actions([{ label:'Back', fn:()=>showTitle() }], {single:true});
  }
}

// ================= BOOT =================
(async function boot(){
  await showSaveSelect();
})();
</script>
