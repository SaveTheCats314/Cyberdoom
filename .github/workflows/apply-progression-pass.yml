name: Apply Progression Expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-progression-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply progression patch
        run: python .github/scripts/apply_progression_pass.py

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          scripts = '\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S))
          Path('/tmp/cyberdoom.js').write_text(scripts)
          PY
          node --check /tmp/cyberdoom.js

      - name: Commit progression pass
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Cyberdoom Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Expand run progression, relics, chrome, and midboss"
          git push
