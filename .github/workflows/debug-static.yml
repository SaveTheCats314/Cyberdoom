name: Cyberdoom Static Debug Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-static.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract game JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          scripts = '\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S))
          Path('/tmp/cyberdoom.js').write_text(scripts)
          PY

      - name: Syntax check
        run: node --check /tmp/cyberdoom.js

      - name: Undefined and control-flow audit
        run: |
          npx --yes eslint@8.57.1 /tmp/cyberdoom.js \
            --no-eslintrc \
            --env browser,es2021 \
            --parser-options '{"ecmaVersion":"latest"}' \
            --rule 'no-undef:error' \
            --rule 'no-unreachable:error' \
            --rule 'no-dupe-keys:error' \
            --rule 'no-func-assign:error' \
            --rule 'valid-typeof:error'
