name: Apply Guard Evade Combat Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-guard-evade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch combat controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Patch target not found: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              "{ id:'ghost_runner',     name:'Ghost Runner Chip',desc:'+15% chance to successfully flee.' },",
              "{ id:'ghost_runner',     name:'Ghost Runner Chip',desc:'+15% chance to successfully evade.' },",
              'Ghost Runner description'
          )

          replace_once(
              "    { label:'Flee', sub:'Risky — may take a hit', cls:'danger', fn:()=>tryFlee() },",
              "    { label:'Guard', sub:'Reduce the next incoming hit by 50%', cls:'gold', fn:()=>guardAction() },\n    { label:'Evade', sub:`${hasRelic(P,'ghost_runner') ? '80' : '65'}% chance to avoid the next attack`, fn:()=>evadeAction() },",
              'combat Flee action'
          )

          flee_pattern = re.compile(r"function tryFlee\(\)\{.*?\n\}\n\nfunction applyHitEffects", re.S)
          if not flee_pattern.search(text):
              raise SystemExit('Patch target not found: tryFlee function')

          defensive_functions = '''function guardAction(){
            const c = S.run.combat;
            if(!c) return;

            c.guarding = true;
            c.evading = false;

            print(
              `<span class="tag hack">GUARD</span> You brace for impact. ` +
              `<span class="good">The next incoming hit will be reduced by 50%.</span>`
            );

            enemyTurn();
          }

          function evadeAction(){
            const P = S.run.player;
            const c = S.run.combat;
            if(!c) return;

            c.evading = true;
            c.guarding = false;
            c.evadeChance = 0.65 + (hasRelic(P,'ghost_runner') ? 0.15 : 0);

            print(
              `<span class="tag hack">EVADE</span> You shift your stance and prepare to move. ` +
              `<span class="accent">${Math.round(c.evadeChance*100)}% chance to avoid the next attack.</span>`
            );

            enemyTurn();
          }

          function applyHitEffects'''
          text = flee_pattern.sub(lambda _: defensive_functions, text, count=1)

          enemy_turn_pattern = re.compile(r"function enemyTurn\(\)\{.*?\n\}\n\nfunction checkDeath\(\)\{", re.S)
          if not enemy_turn_pattern.search(text):
              raise SystemExit('Patch target not found: enemyTurn function')

          new_enemy_turn = '''function enemyTurn(){
            const P = S.run.player; const c = S.run.combat;
            if(!c) return;

            if(c.enemyBleed>0){
              c.enemy.hp -= c.enemyBleed;
              print(`<span class="tag">BLEED</span> ${c.enemy.name} takes <b>${c.enemyBleed}</b> bleed damage.`);
              c.enemyBleed = 0;
              refreshStatus();
              if(c.enemy.hp<=0) return winCombat();
            }

            if(c.enemyStunned){
              print(`<b>${c.enemy.name}</b> is stunned and skips its turn.`);
              c.enemyStunned=false;
            }
            else{
              let d = rnd(...c.enemy.dmg) - Math.floor(P.def);

              if(c.enemy.berserk && c.enemy.hp < c.enemy.maxHp*0.4){
                d = Math.round(d*1.5);
              }

              let avoided = false;

              if(c.evading){
                const evadeChance = c.evadeChance || 0.65;

                if(Math.random() < evadeChance){
                  print(
                    `<span class="tag hack">EVADE</span> You slip past ` +
                    `<b>${c.enemy.name}</b>'s attack completely.`,
                    'good'
                  );
                  d = 0;
                  avoided = true;
                } else {
                  print(
                    `<span class="tag combat">EVADE FAILED</span> ` +
                    `<b>${c.enemy.name}</b> tracks your movement.`
                  );
                }

                c.evading = false;
                c.evadeChance = 0;
              }

              if(!avoided && Math.random() < P.dodge){
                print(`You dodge <b>${c.enemy.name}</b>'s attack completely.`,'good');
                d = 0;
                avoided = true;
              }

              if(c.guarding && d > 0){
                const original = Math.max(0,d);
                d = Math.ceil(original * 0.5);

                print(
                  `<span class="tag hack">GUARD</span> You absorb the hit. ` +
                  `<span class="good">${original} → ${d} damage.</span>`
                );
              }

              c.guarding = false;
              d = Math.max(0,d);

              if(d>0){
                P.hp = clamp(P.hp-d,0,P.maxHp);
                print(`<b>${c.enemy.name}</b> hits you for <span class="bad">${d}</span>.`);
              }
            }
            if(P.regen>0) P.hp = clamp(P.hp+P.regen, 0, P.maxHp);
            if(c.rallyTurns){ c.rallyTurns--; if(c.rallyTurns<=0){ P.dmgBonus-=2; P.def-=1; P.cool-=2; c.rallyTurns=null; print('Rally Cry fades.', 'flavor'); } }
            if(P.ability.cdLeft>0) P.ability.cdLeft--;
            refreshStatus();
            if(checkDeath()) return;
            combatMenu();
          }

          function checkDeath(){'''
          text = enemy_turn_pattern.sub(lambda _: new_enemy_turn, text, count=1)

          path.write_text(text)
          PY

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          scripts = '\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S))
          Path('/tmp/cyberdoom.js').write_text(scripts)
          PY
          node --check /tmp/cyberdoom.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Cyberdoom Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Replace Flee with Guard and Evade"
          git push