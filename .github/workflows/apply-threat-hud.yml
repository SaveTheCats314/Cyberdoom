name: Apply Threat HUD Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-threat-hud.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/apply_threat_hud.py
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          scripts = '\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S))
          Path('/tmp/cyberdoom.js').write_text(scripts)
          PY
          node --check /tmp/cyberdoom.js
      - name: Commit patch
        run: |
          git config user.name "Cyberdoom Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add dynamic enemy threat indicators"
          git push
